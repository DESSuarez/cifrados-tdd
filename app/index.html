    <button class="btn" id="lbtn">Entrar</button>
    <div class="row"><button type="button" class="btn sm ghost" id="lreg">Crear cuenta</button><span class="sp"></span><button type="button" class="btn sm ghost" id="lrec">Olvidé mi contraseña</button></div>
    <p class="status" id="lmsg">${esc(st.avisoLogin || "")}</p>
    <p class="status" style="font-size:11.5px">¿Tu ministerio aún no usa Cifrados? Escríbenos para darlo de alta.</p></form></div>`;
}
/** Mensajes de Supabase en español. */
function errorAuth(m) {
  m = String(m || "");
  if (/invalid login|invalid credentials/i.test(m)) return "Correo o contraseña incorrectos.";
  if (/not confirmed/i.test(m)) return "Falta confirmar tu correo: abre la liga que te mandamos.";
  if (/already registered|already exists/i.test(m)) return "Ese correo ya tiene cuenta. Entra o recupera tu contraseña.";
  if (/rate limit/i.test(m)) return "Se mandaron demasiados correos. Espera un rato e inténtalo de nuevo.";
  if (/at least|password should/i.test(m)) return "La contraseña debe tener al menos 8 caracteres.";
  if (/same password|different from the old/i.test(m)) return "Usa una contraseña distinta a la anterior.";
  return m;
}
// Crear contraseña al abrir una invitación o una liga de recuperación
function vNuevaClave() {
  const inv = (st.ponerClave || D.estado.ponerClave) === "invite", p = miPerfil() || {};
  return `<div class="login"><form class="card" id="fclave"><img src="icono-512.png" width="56" height="56" alt="" style="border-radius:12px;background:#1B1C1A">
    <h1>${inv ? "Bienvenido" : "Nueva contraseña"}</h1><p>${inv ? "Te invitaron a Cifrados de Tiempo de Dios. Crea tu contraseña para entrar." : "Escribe tu nueva contraseña."}</p>
    ${inv ? `<label class="lb">Tu nombre<input class="field" name="nombre" value="${esc(p.nombre || "")}" autocomplete="name" required></label>` : ""}
    <label class="lb">Contraseña<input class="field" name="pass" type="password" autocomplete="new-password" minlength="8" required></label>
    <label class="lb">Repítela<input class="field" name="pass2" type="password" autocomplete="new-password" minlength="8" required></label>
    <button class="btn">Guardar y entrar</button><p class="status" id="cmsg"></p></form></div>`;
}
function enlazarNuevaClave() {
  const f = $("#fclave"), msg = $("#cmsg");
  f.onsubmit = async e => {
    e.preventDefault();
    if (f.pass.value !== f.pass2.value) return (msg.textContent = "Las contraseñas no coinciden.");
    msg.textContent = "…";
    try {
      const nombre = f.nombre ? f.nombre.value.trim() : "";
      await D.nuevaClave(f.pass.value, nombre);
      if (nombre) { const p = miPerfil() || { id: yo().id, estilo: {} }; await D.guardar("cif_perfiles", { ...p, nombre }); }
      st.ponerClave = null; D.estado.ponerClave = null;
      history.replaceState(null, "", location.pathname + "#libreria"); render(); toast("Contraseña guardada.");
    } catch (er) { msg.textContent = errorAuth(er.message); }
  };
}
function enlazarLogin() {
  let modo = "entrar"; const f = $("#flog"), msg = $("#lmsg");
  $("#lreg").onclick = () => { modo = modo === "entrar" ? "registro" : "entrar"; $("#lnom").hidden = modo !== "registro"; $("#lbtn").textContent = modo === "registro" ? "Crear cuenta" : "Entrar"; $("#lreg").textContent = modo === "registro" ? "Ya tengo cuenta" : "Crear cuenta"; };
  $("#lrec").onclick = async () => { const em = f.email.value.trim(); if (!em) return (msg.textContent = "Escribe tu correo primero."); try { await D.recuperar(em); msg.textContent = "Te mandamos un correo para cambiar tu contraseña."; } catch (e) { msg.textContent = e.message; } };
  f.onsubmit = async e => {
    e.preventDefault(); msg.textContent = "…";
    try {
      if (modo === "registro") { await D.registrarse(f.email.value.trim(), f.pass.value, f.nombre.value.trim()); msg.textContent = "Cuenta creada. Revisa tu correo para confirmarla y luego entra."; }
      else await D.entrar(f.email.value.trim(), f.pass.value);
    } catch (er) { msg.textContent = errorAuth(er.message); }
  };
}

// ================= Arranque =================
(async function () {
  aplicarEstilo();
  $("#app").innerHTML = `<div class="login"><p style="color:#fff;font-family:var(--mono)">Cargando…</p></div>`;
  // ¿Llegó por una liga de correo? (#access_token=…&type=invite|recovery|signup, o #error=…)
  const h0 = window.HASH0 || "", tipo = (/type=(invite|recovery|signup|magiclink)/.exec(h0) || [])[1];
  if (tipo === "invite" || tipo === "recovery") st.ponerClave = tipo;
  if (/error_description=/.test(h0)) st.avisoLogin = /expired|invalid/i.test(decodeURIComponent(h0)) ? "La liga ya venció o ya se usó. Pide que te la reenvíen o usa «Olvidé mi contraseña»." : "No se pudo abrir la liga del correo.";
  await D.iniciar();
  if (tipo === "signup" && yo()) setTimeout(() => toast("¡Correo confirmado! Ya puedes usar Cifrados."), 400);
  if (D.estado.limpiado) setTimeout(() => toast("Se borró lo que tenías en modo local; ahora todo vive en la nube."), 600);
  if (tipo || st.avisoLogin) history.replaceState(null, "", location.pathname + "#libreria");
  // modo local: crea mi perfil la primera vez
  if (D.modo === "local" && !miPerfil()) await D.guardar("cif_perfiles", { id: yo().id, nombre: "Yo", artista: true, estilo: st.estilo });
  const p = miPerfil(); if (p && p.estilo && Object.keys(p.estilo).length) {
    st.estilo = Object.assign(st.estilo, p.estilo);
    if (!p.estilo.notacion) st.estilo.notacion = p.estilo.nashville ? "nashville" : p.estilo.latina ? "latino" : st.estilo.notacion;
    delete st.estilo.nashville; delete st.estilo.latina;
  }
  render();
  D.alEstado(() => { if (D.modo !== "local" && yo() && miPerfil() && $(".login")) render(); });
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    // cuando se instala una versión nueva de la app, se recarga sola (salvo si alguien está editando)
    const habia = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (!habia) return;
      if (st.editando) toast("Hay una versión nueva de Cifrados: recarga al terminar de editar.");
      else location.reload();
    });
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
})();
