function irSeccion(nombre) {
  const el = $$(".csec").find(s => s.dataset.sec === nombre);
  if (!el) return;
  $$(".csec.vivo").forEach(x => x.classList.remove("vivo")); el.classList.add("vivo");
  el.scrollIntoView({ behavior: "smooth", block: "start" });
}
function irItem(i) {
  if (!ctxSet) return;
  const s = D.uno("cif_sets", ctxSet.s.id) || ctxSet.s;
  if (i < 0 || i >= s.items.length) return;
  if (st.dirigir && vivo) vivo.enviar({ i });
  location.hash = `#cancion/${s.items[i].cancion_id}/set/${s.id}/${i}`;
}
function conectarVivo(setId) {
  if (vivo && vivo.id === setId) return;
  salirVivo();
  const ch = D.canalVivo(setId, pl => {
    if (!st.seguir || !ctxSet) return;
    if (pl.i !== ctxSet.i) { const s = D.uno("cif_sets", setId); if (s && s.items[pl.i]) location.hash = `#cancion/${s.items[pl.i].cancion_id}/set/${setId}/${pl.i}`; }
    if (pl.sec) setTimeout(() => irSeccion(pl.sec), 300);
  });
  vivo = { id: setId, ...ch };
}
function salirVivo() { if (vivo) { vivo.salir(); vivo = null; } st.dirigir = false; }
function deslizar(el, fn) {
  if (!el) return; let x0 = null, y0 = 0;
  el.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  el.addEventListener("touchend", e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; if (Math.abs(dx) > 80 && Math.abs(dx) > Math.abs(dy) * 1.6) fn(dx < 0 ? 1 : -1); x0 = null; }, { passive: true });
}

// Desplazamiento automático
const autoscroll = { on: false, vel: ls.get("cifrados-vel", 28), raf: 0, t: 0, acc: 0 };
function alternarAutoscroll() {
  autoscroll.on = !autoscroll.on;
  const b = $("#tauto"); if (b) { b.innerHTML = (autoscroll.on ? "❚❚" : "▼") + " Auto"; b.classList.toggle("on", autoscroll.on); }
  if (autoscroll.on) { autoscroll.t = performance.now(); autoscroll.acc = 0; autoscroll.raf = requestAnimationFrame(pasoScroll); }
  else cancelAnimationFrame(autoscroll.raf);
}
// velocidad en niveles 1–20 (8 px por segundo cada nivel), se ajusta ahí mismo con − y +
const nivelVel = () => Math.max(1, Math.min(20, Math.round(autoscroll.vel / 8)));
function cambiarVel(d) {
  autoscroll.vel = (nivelVel() + d) * 8;
  autoscroll.vel = Math.max(8, Math.min(160, autoscroll.vel)); ls.set("cifrados-vel", autoscroll.vel);
  const o = $("#vval"); if (o) o.textContent = nivelVel();
}
function pasoScroll(t) {
  const dt = (t - autoscroll.t) / 1000; autoscroll.t = t;
  autoscroll.acc += autoscroll.vel * dt;
  if (autoscroll.acc >= 1) { const n = Math.floor(autoscroll.acc); window.scrollBy(0, n); autoscroll.acc -= n; }
  if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 2) { autoscroll.on = false; const b = $("#tauto"); if (b) { b.innerHTML = "▼ Auto"; b.classList.remove("on"); } return; }
  autoscroll.raf = requestAnimationFrame(pasoScroll);
}
function detenerAutoscroll() { if (autoscroll.on) { autoscroll.on = false; cancelAnimationFrame(autoscroll.raf); } }
document.addEventListener("keydown", e => {
  if (!autoscroll.on || /INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || "")) return;
  if (e.key === "+" || e.key === "=") cambiarVel(1);
  if (e.key === "-") cambiarVel(-1);
});

// ---------- Pistas: cambiar tono sin cambiar velocidad (Tone.js GrainPlayer) ----------
const rep = { player: null, track: null, sonando: false, inicio: 0, offset: 0, dur: 0, rate: 1, ajuste: 0, auto: true, vol: 0, raf: 0, url: "" };
let toneP = null;
function cargarTone() {
  if (window.Tone) return Promise.resolve();
  if (!toneP) toneP = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"; s.onload = res; s.onerror = () => { toneP = null; rej(new Error("No se pudo cargar el reproductor (sin internet la primera vez).")); }; document.head.appendChild(s); });
  return toneP;
}
const semisPista = () => rep.auto && rep.track && rep.track.tono ? C.distancia(rep.track.tono, rep.tonoVista) + rep.ajuste : rep.ajuste;
async function abrirPista(t, c, tono) {
  try {
    toast("Cargando pista…");
    await cargarTone(); await Tone.start();
    const blob = await D.audio(t.ruta);
    if (!blob) return toast("La pista no está en este dispositivo y no hay nube.");
    cerrarPista();
    rep.url = URL.createObjectURL(blob);
    const buf = await Tone.ToneAudioBuffer.fromUrl(rep.url);
    rep.player = new Tone.GrainPlayer({ url: buf, grainSize: 0.12, overlap: 0.06 }).toDestination();
    rep.track = t; rep.dur = buf.duration; rep.offset = 0; rep.ajuste = 0; rep.rate = 1; rep.tonoVista = tono;
    ajustarPitch(); render(); alternarPlay();
  } catch (e) { console.error(e); toast("No se pudo abrir la pista: " + (e.message || e)); }
}
function posPista() { return rep.sonando ? Math.min(rep.dur, rep.offset + (Tone.now() - rep.inicio) * rep.rate) : rep.offset; }
function alternarPlay() {
  if (!rep.player) return;
  if (rep.sonando) { rep.offset = posPista(); rep.player.stop(); rep.sonando = false; }
  else { if (rep.offset >= rep.dur - .05) rep.offset = 0; rep.player.start(undefined, rep.offset); rep.inicio = Tone.now(); rep.sonando = true; }
  pintarPlayer(); $$("[data-pista]").forEach(b => b.textContent = rep.track && b.dataset.pista === rep.track.id && rep.sonando ? "❚❚" : "▶");
}
function buscarPista(seg) { const s = rep.sonando; if (s) { rep.player.stop(); rep.sonando = false; } rep.offset = Math.max(0, Math.min(rep.dur, seg)); if (s) alternarPlay(); else pintarPlayer(); }
function ajustarPitch() { if (!rep.player) return; rep.player.detune = semisPista() * 100; const o = $("#plsemis"); if (o) pintarPlayer(); }
function cerrarPista() { if (rep.player) { try { rep.player.stop(); rep.player.dispose(); } catch (e) {} } if (rep.url) URL.revokeObjectURL(rep.url); rep.player = null; rep.track = null; rep.sonando = false; clearInterval(rep.raf); }
const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function pintarPlayer() {
  const box = $("#playerbox"); if (!box || !rep.track) return;
  const sm = semisPista(), suena = rep.track.tono ? C.transportaTono(rep.track.tono, sm) : null;
  box.innerHTML = `<div class="player" style="margin-top:12px">
    <div class="pl-top"><button class="playbtn" id="plplay" aria-label="Reproducir">${rep.sonando ? IC.pausa : IC.play}</button><div><b>${esc(rep.track.nombre)}</b><small id="pltime">${mmss(posPista())} / ${mmss(rep.dur)}</small></div></div>
    <input type="range" id="plpos" min="0" max="${rep.dur}" step="0.1" value="${posPista()}" aria-label="Posición">
    <div class="pl-ctl">
      <span>Tono</span><input type="range" id="plaj" min="-6" max="6" step="1" value="${rep.ajuste}"><output id="plsemis">${sm > 0 ? "+" : ""}${sm} st${suena ? " · " + esc(suena) : ""}</output>
      <span>Velocidad</span><input type="range" id="plrate" min="0.7" max="1.3" step="0.01" value="${rep.rate}"><output>${Math.round(rep.rate * 100)}%</output>
      <span>Volumen</span><input type="range" id="plvol" min="-30" max="6" step="1" value="${rep.vol}"><output>${rep.vol} dB</output>
    </div>
    <label class="row" style="font-size:13px;font-weight:600"><input type="checkbox" id="plauto" ${rep.auto ? "checked" : ""}> Seguir el tono de la canción${rep.track.tono ? "" : " (indica en qué tono está grabada la pista)"}</label>
  </div>`;
  $("#plplay").onclick = alternarPlay;
  $("#plpos").oninput = e => buscarPista(+e.target.value);
  $("#plaj").oninput = e => { rep.ajuste = +e.target.value; ajustarPitch(); };
  $("#plrate").oninput = e => { const p = posPista(); rep.rate = +e.target.value; rep.player.playbackRate = rep.rate; rep.offset = p; rep.inicio = Tone.now(); e.target.nextElementSibling.textContent = Math.round(rep.rate * 100) + "%"; };
  $("#plvol").oninput = e => { rep.vol = +e.target.value; rep.player.volume.value = rep.vol; e.target.nextElementSibling.textContent = rep.vol + " dB"; };
  $("#plauto").onchange = e => { rep.auto = e.target.checked; ajustarPitch(); };
  // intervalo (no requestAnimationFrame) para que el final se detecte aunque la pantalla esté apagada o la pestaña en segundo plano
  clearInterval(rep.raf);
  const tick = () => {
    if (!rep.track) return clearInterval(rep.raf);
    if (rep.sonando && posPista() >= rep.dur - .05) { rep.sonando = false; rep.offset = 0; clearInterval(rep.raf); pintarPlayer(); $$("[data-pista]").forEach(b => (b.textContent = "▶")); return; }
    const t = $("#pltime"), r = $("#plpos"); if (!t) return;
    t.textContent = `${mmss(posPista())} / ${mmss(rep.dur)}`; if (document.activeElement !== r) r.value = posPista();
  };
  tick(); rep.raf = setInterval(tick, 250);
}
async function subirPista(f, c, original) {
  if (!f) return;
  if (f.size > 50 * 1024 * 1024) return toast("La pista pesa más de 50 MB.");
  const d = await dialogo(`<h2>Subir pista</h2><p>${esc(f.name)}</p>
    <label class="lb">Nombre<input class="field" name="nombre" value="${esc(f.name.replace(/\.[^.]+$/, ""))}"></label>
    <div class="grid2"><label class="lb">Tipo<select class="field" name="tipo"><option value="pista">Pista completa</option><option value="guia">Guía (voz)</option><option value="click">Click</option><option value="stem">Stem</option></select></label>
    <label class="lb">Grabada en<select class="field" name="tono">${C.TONOS.map(t => `<option ${t === original ? "selected" : ""}>${t}</option>`).join("")}</select></label></div>`, "Subir");
  if (!d) return;
  try {
    toast("Subiendo pista…");
    const ruta = `${c.id}/${Date.now()}-${f.name.replace(/[^\w.\-]+/g, "_")}`;
    await D.subirAudio(ruta, f);
    await D.guardar("cif_tracks", { cancion_id: c.id, nombre: d.nombre || f.name, tipo: d.tipo, tono: d.tono, ruta, tam: f.size });
    toast("Pista lista.");
  } catch (e) { toast("No se pudo subir: " + (e.message || e)); }
}

// ================= SETS =================
// Dos tipos: normal (lista libre) y litúrgico (por momentos de la misa).
// Cada canción del set puede tener su propia estructura en bloques (arrastrar, duplicar, quitar) que ven todos en tiempo real.
function vSets() {
  const m = minActual();
  if (!m) return { band: bandHTML({ titulo: "Sets" }), main: `<div class="empty"><strong>Aún no estás en un ministerio</strong><p>Los sets son de cada ministerio. Pide entrar al tuyo en Ministerios y espera a que un admin te acepte.</p><a class="btn" href="#ministerios">Ir a Ministerios</a></div>` };
  const sets = D.lista("cif_sets").filter(s => !s.borrada && s.ministerio_id === m.id).sort((a, b) => (b.fecha || "").localeCompare(a.fecha || ""));
  const hoy = hoyISO();
  const prox = sets.filter(s => (s.fecha || "") >= hoy).reverse(), pas = sets.filter(s => (s.fecha || "") < hoy);
  const card = s => { const f = s.fecha ? new Date(s.fecha + "T12:00") : null; return `<li><a class="setcard" href="#set/${s.id}"><time>${f ? `<b>${f.getDate()}</b>${f.toLocaleDateString("es-MX", { month: "short", weekday: "short" })}` : "—"}</time><div><h3>${esc(s.nombre)}${s.tipo === "liturgico" ? ' <span class="chip mio">⛪ Misa</span>' : ""}</h3><p>${s.items.length} canciones · ${esc(s.items.map(i => (D.uno("cif_canciones", i.cancion_id) || {}).titulo).filter(Boolean).join(" · ") || "vacío")}</p></div><span class="chip">${s.items.length}</span></a></li>`; };
  const puede = ["admin", "musico"].includes(rolEn(m.id));
  return {
    band: bandHTML({ tag: m.nombre, titulo: "Sets de <em>" + esc(m.nombre) + "</em>", sub: `<span>Se actualizan en tiempo real para todo el ministerio</span>` }),
    main: `${puede ? `<div class="row"><button class="btn" id="nset">${IC.mas} Nuevo set</button><button class="btn ghost" id="nmisa">⛪ Nueva misa</button></div>` : ""}
      ${sets.length ? `${prox.length ? `<h2 class="status">PRÓXIMOS</h2><ul class="sets">${prox.map(card).join("")}</ul>` : ""}${pas.length ? `<h2 class="status">ANTERIORES</h2><ul class="sets">${pas.map(card).join("")}</ul>` : ""}`
        : `<div class="empty"><strong>Sin sets todavía</strong><p>Arma el set del domingo o la misa por momentos: canciones, tono de cada una y quién dirige. Todo el equipo lo ve al momento.</p></div>`}`,
    after() {
      const nuevo = async tipo => {
        const dom = new Date(); dom.setDate(dom.getDate() + ((7 - dom.getDay()) % 7));
        const d = await dialogo(`<h2>${tipo === "liturgico" ? "Nueva misa" : "Nuevo set"}</h2><label class="lb">Nombre<input class="field" name="nombre" value="${tipo === "liturgico" ? "Misa dominical" : ""}" placeholder="Cenáculo, Retiro…" required></label><label class="lb">Fecha<input class="field" type="date" name="fecha" value="${dom.toISOString().slice(0, 10)}"></label>`, "Crear");
        if (!d || !d.nombre) return;
        const s = await D.guardar("cif_sets", { ministerio_id: m.id, nombre: d.nombre, fecha: d.fecha || null, tipo, items: [], notas: "" });
        location.hash = "#set/" + s.id;
      };
      const b = $("#nset"); if (b) b.onclick = () => nuevo("normal");
      const bm = $("#nmisa"); if (bm) bm.onclick = () => nuevo("liturgico");
    },
  };
}

/** Bloques de estructura de una canción en un set. */
const bloquesDe = (it, c) => (it.estructura && it.estructura.length ? it.estructura : c.orden && c.orden.length ? c.orden : C.secciones(c.contenido));
function estructuraHTML(it, i, c, puede) {
  const bl = bloquesDe(it, c), secs = [...new Set(C.secciones(c.contenido))];
  return `<div class="estr" data-estr="${i}">
    ${bl.map((b, k) => `<span class="blq" data-k="${k}" style="--sc:var(${C.colorSeccion(b)})">${puede ? `<span class="blqa" title="Arrastra para mover">⋮⋮</span>` : ""}<span class="blqn">${esc(b)}</span>${puede ? `<button data-dup="${k}" title="Duplicar">⧉</button><button data-del="${k}" title="Quitar">✕</button>` : ""}</span>`).join("") || `<span class="status">La canción no tiene secciones marcadas.</span>`}
    ${puede && secs.length ? `<select class="fsel" data-addblq="${i}" aria-label="Agregar sección"><option value="">＋ Sección</option>${secs.map(s => `<option>${esc(s)}</option>`).join("")}</select>` : ""}
    ${puede && it.estructura ? `<button class="btn xs ghost" data-reset="${i}">Como la canción</button>` : ""}
  </div>`;
}
function itemHTML(s, it, i, puede, gente) {
  const c = D.uno("cif_canciones", it.cancion_id) || { titulo: "(canción borrada)", tono: "", contenido: "" };
  const orig = c.tono || "C";
  const opT = C.TONOS.filter(t => t.endsWith("m") === orig.endsWith("m")).map(t => `<option ${t === (it.tono || orig) ? "selected" : ""}>${t}</option>`).join("");
  const abierto = st.abiertos.has(it.id);
  return `<li class="item" data-i="${i}">
    ${puede ? `<div class="mov"><button data-sube="${i}" aria-label="Subir">▲</button><button data-baja="${i}" aria-label="Bajar">▼</button></div>` : "<span></span>"}
    <span class="num">${i + 1}</span>
    <div class="tit"><a href="#cancion/${it.cancion_id}/set/${s.id}/${i}">${esc(c.titulo)}</a><small>${esc(c.autor || "")}${it.nota ? " · " + esc(it.nota) : ""}${it.estructura ? " · estructura propia" : ""}</small></div>
    <div class="opts">${puede ? `<select data-itono="${i}" title="Tono">${opT}</select>
      <select data-iper="${i}" title="Dirige"><option value="">¿Quién dirige?</option>${gente.map(p => { const t = D.uno("cif_tonos", it.cancion_id + "|" + p.id); return `<option value="${p.id}" ${p.id === it.persona_id ? "selected" : ""}>${esc(p.nombre)}${t ? " · " + t.tono : ""}</option>`; }).join("")}</select>
      <input data-inota="${i}" value="${esc(it.nota || "")}" placeholder="Nota" style="width:110px">`
      : `<span class="chip tono">${esc(it.tono || orig)}</span>${it.persona_id ? `<span class="chip">${esc(nombreDe(it.persona_id))}</span>` : ""}`}
      <button class="btn xs ${abierto ? "on" : "ghost"}" data-abre="${it.id}" title="Estructura en bloques">▦ Estructura</button>
      ${puede ? `<button class="btn xs ghost" data-quita="${i}" aria-label="Quitar">✕</button>` : ""}</div>
    ${abierto ? estructuraHTML(it, i, c, puede) : ""}</li>`;
}
function vSet(id) {
  const s = D.uno("cif_sets", id);
  if (!s || s.borrada) return { band: bandHTML({ titulo: "No encontré ese set" }), main: `<a class="btn ghost" href="#sets">← Sets</a>` };
  const m = D.uno("cif_ministerios", s.ministerio_id), puede = editaSet(s), lit = s.tipo === "liturgico";
  const gente = personasMin(s.ministerio_id);
  let cuerpo;
  if (lit) {
    // un bloque por momento; las canciones sin momento van en "Otros"
    const por = new Map(MOMENTOS.map(([k]) => [k, []])); por.set("", []);
    s.items.forEach((it, i) => (por.get(it.momento || "") || por.get("")).push([it, i]));
    cuerpo = [...MOMENTOS, ["", "Otros"]].map(([k, l]) => {
      const lista = por.get(k);
      if (k === "" && !lista.length) return "";
      return `<section class="momento"><div class="row"><h3>${esc(l)}</h3><span class="sp"></span>${puede && k ? `<button class="btn xs ghost" data-addm="${k}">＋ Agregar</button>` : ""}</div>
        ${lista.length ? `<ul class="items">${lista.map(([it, i]) => itemHTML(s, it, i, puede, gente)).join("")}</ul>` : `<p class="status" style="margin:4px 0 0">Sin canción</p>`}</section>`;
    }).join("");
  } else {
    cuerpo = s.items.length ? `<ul class="items">${s.items.map((it, i) => itemHTML(s, it, i, puede, gente)).join("")}</ul>` : `<div class="empty"><strong>Set vacío</strong><p>Busca canciones abajo para agregarlas.</p></div>`;
  }
  const quien = s.actualizado_por ? nombreDe(s.actualizado_por) : "";
  return {
    band: bandHTML({ tag: lit ? "Misa · " + (m ? m.nombre : "") : m ? m.nombre : "Set", titulo: esc(s.nombre), sub: `<span>${s.fecha ? new Date(s.fecha + "T12:00").toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" }) : "Sin fecha"}</span><span>${s.items.length} canciones</span>${quien ? `<span>Último cambio: ${esc(quien)}</span>` : ""}`,
      extra: `<div class="row">${s.items.length ? `<a class="navbtn on" href="#cancion/${s.items[0].cancion_id}/set/${s.id}/0">▶ Tocar ${lit ? "la misa" : "el set"}</a>` : ""}<button class="navbtn" id="spdf" title="Exportar el set a PDF con su tono y estructura">⎙ PDF</button><a class="navbtn" href="#sets">← Sets</a></div>` }),
    main: `
      ${puede ? `<div class="grid2"><label class="lb">Nombre<input class="field" id="snombre" value="${esc(s.nombre)}"></label><label class="lb">Fecha<input class="field" type="date" id="sfecha" value="${esc(s.fecha || "")}"></label></div>` : ""}
      ${cuerpo}
      ${puede && !lit ? `<div class="caja"><h3>Agregar canción</h3><input class="field" id="sbus" placeholder="Buscar en la librería…" autocomplete="off"><ul class="resultados" id="sres" hidden></ul></div>` : ""}
      ${puede ? `<label class="lb">Notas del set<textarea class="field" id="snotas" rows="3" placeholder="Ensayo, vestimenta, dinámica…">${esc(s.notas || "")}</textarea></label>` : s.notas ? `<div class="caja"><h3>Notas</h3><p class="notas">${esc(s.notas)}</p></div>` : ""}
      ${puede ? `<div class="row"><span class="sp"></span><button class="btn sm ghost" id="sborrar">Borrar set</button></div>` : ""}`,
    after() {
      $$("[data-abre]").forEach(b => b.onclick = () => { const k = b.dataset.abre; st.abiertos.has(k) ? st.abiertos.delete(k) : st.abiertos.add(k); render(); });
      // PDF del set: cada canción en su tono, con su estructura en bloques, momento y quién dirige
      $("#spdf").onclick = () => abrirExportar({ multiple: true, minId: s.ministerio_id, titulo: s.nombre,
        subtitulo: [s.fecha ? new Date(s.fecha + "T12:00").toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long", year: "numeric" }) : "", m ? m.nombre : ""].filter(Boolean).join(" · "),
        items: s.items.map(it => ({ it, c: D.uno("cif_canciones", it.cancion_id) })).filter(x => x.c).map(({ it, c }) => ({ c, tono: it.tono, orden: it.estructura && it.estructura.length ? it.estructura : c.orden, nota: it.nota, momento: it.momento ? nombreMomento(it.momento) : "", persona: it.persona_id ? "Dirige " + nombreDe(it.persona_id) : "" })) });
      if (!puede) return;
      const guarda = cambios => D.guardar("cif_sets", { ...(D.uno("cif_sets", id) || s), ...cambios });
      const itemsAct = () => (D.uno("cif_sets", id) || s).items.map(x => ({ ...x }));
      const ponItem = (i, cambios) => { const it = itemsAct(); it[i] = { ...it[i], ...cambios }; guarda({ items: it }); };
      $("#snombre").onchange = e => guarda({ nombre: e.target.value.trim() || s.nombre });
      $("#sfecha").onchange = e => guarda({ fecha: e.target.value || null });
      $("#snotas").onchange = e => guarda({ notas: e.target.value });
      // en una misa solo se mueve dentro del mismo momento
      const mover = (i, d) => {
        const it = itemsAct(); let j = i + d;
        if (lit) { while (j >= 0 && j < it.length && (it[j].momento || "") !== (it[i].momento || "")) j += d; }
        if (j < 0 || j >= it.length) return;
        [it[i], it[j]] = [it[j], it[i]]; guarda({ items: it });
      };
      $$("[data-sube]").forEach(b => b.onclick = () => mover(+b.dataset.sube, -1));
      $$("[data-baja]").forEach(b => b.onclick = () => mover(+b.dataset.baja, 1));
      $$("[data-quita]").forEach(b => b.onclick = () => { const it = itemsAct(); it.splice(+b.dataset.quita, 1); guarda({ items: it }); });
      $$("[data-itono]").forEach(x => x.onchange = () => ponItem(+x.dataset.itono, { tono: x.value }));
      $$("[data-inota]").forEach(x => x.onchange = () => ponItem(+x.dataset.inota, { nota: x.value.trim() }));
      $$("[data-iper]").forEach(x => x.onchange = () => {
        const i = +x.dataset.iper, it = itemsAct(), t = x.value && D.uno("cif_tonos", it[i].cancion_id + "|" + x.value);
        ponItem(i, { persona_id: x.value || null, ...(t ? { tono: t.tono } : {}) });
        if (t) toast(`Se puso el tono de ${nombreDe(x.value)}: ${t.tono}`);
      });
      const nuevoItem = (c, momento) => ({ id: D.uuid(), cancion_id: c.id, tono: c.tono || C.adivinaTono(c.contenido), persona_id: null, nota: "", ...(momento ? { momento } : {}) });
      // misa: agregar a un momento (queda en el orden de la misa)
      $$("[data-addm]").forEach(b => b.onclick = async () => {
        const k = b.dataset.addm, c = await elegirCancion(k);
        if (!c) return;
        const it = itemsAct(), pos = MOMENTOS.findIndex(x => x[0] === k);
        let ins = it.length;
        for (let j = 0; j < it.length; j++) { const pj = MOMENTOS.findIndex(x => x[0] === it[j].momento); if (pj > pos || pj < 0) { ins = j; break; } }
        it.splice(ins, 0, nuevoItem(c, k)); guarda({ items: it }); toast(`«${c.titulo}» en ${nombreMomento(k)}.`);
      });
      const bus = $("#sbus"), res = $("#sres");
      if (bus) bus.oninput = () => {
        const q = norm(bus.value);
        if (!q) { res.hidden = true; return; }
        const r = canciones().filter(c => norm(c.titulo + " " + c.autor).includes(q)).slice(0, 12);
        res.hidden = false;
        res.innerHTML = r.length ? r.map(c => `<li><button data-add="${c.id}"><span><b>${esc(c.titulo)}</b> <small class="status">${esc(c.autor || "")}</small></span><span class="chip tono">${esc(c.tono || "")}</span></button></li>`).join("") : `<li class="status" style="padding:10px 12px">Sin resultados</li>`;
        $$("[data-add]", res).forEach(b => b.onclick = () => {
          const c = D.uno("cif_canciones", b.dataset.add);
          guarda({ items: itemsAct().concat([nuevoItem(c)]) });
          bus.value = ""; res.hidden = true; toast(`«${c.titulo}» agregada.`);
        });
      };
      // ----- estructura en bloques -----
      const ponBloques = (i, bl) => { const it = itemsAct(); const c = D.uno("cif_canciones", it[i].cancion_id); it[i] = { ...it[i], estructura: bl }; if (c && JSON.stringify(bl) === JSON.stringify(bloquesDe({}, c))) delete it[i].estructura; guarda({ items: it }); };
      $$(".estr").forEach(box => {
        const i = +box.dataset.estr, it = itemsAct()[i], c = D.uno("cif_canciones", it.cancion_id);
        if (!c) return;
        const bl = bloquesDe(it, c).slice();
        $$("[data-dup]", box).forEach(b => b.onclick = () => { const k = +b.dataset.dup; bl.splice(k + 1, 0, bl[k]); ponBloques(i, bl); });
        $$("[data-del]", box).forEach(b => b.onclick = () => { bl.splice(+b.dataset.del, 1); ponBloques(i, bl); });
        const add = $("[data-addblq]", box); if (add) add.onchange = () => { if (add.value) { const v = add.value; add.blur(); bl.push(v); ponBloques(i, bl); } };
        const rs = $("[data-reset]", box); if (rs) rs.onclick = () => { const x = itemsAct(); delete x[i].estructura; guarda({ items: x }); };
        // arrastrar con mouse o dedo (pointer events)
        $$(".blq", box).forEach(el => {
          const asa = $(".blqa", el) || el;
          asa.addEventListener("pointerdown", ev => {
            ev.preventDefault(); st.arrastrando = true;
            const k = +el.dataset.k; el.classList.add("arrastra");
            let destino = k;
            const mueve = e => {
              const bajo = document.elementFromPoint(e.clientX, e.clientY), b2 = bajo && bajo.closest(".blq");
              $$(".blq.sobre", box).forEach(x => x.classList.remove("sobre"));
              if (b2 && b2.parentNode === box) { destino = +b2.dataset.k; if (destino !== k) b2.classList.add("sobre"); }
            };
            const suelta = () => {
              document.removeEventListener("pointermove", mueve); document.removeEventListener("pointerup", suelta); document.removeEventListener("pointercancel", suelta);
              st.arrastrando = false; el.classList.remove("arrastra");
              if (destino !== k) { const [x] = bl.splice(k, 1); bl.splice(destino, 0, x); ponBloques(i, bl); } else render();
            };
            document.addEventListener("pointermove", mueve); document.addEventListener("pointerup", suelta); document.addEventListener("pointercancel", suelta);
          });
        });
      });
      $("#sborrar").onclick = async () => { if (await confirmar(`¿Borrar el set «${s.nombre}»?`, "Desaparece para todo el ministerio.")) { await D.borrar("cif_sets", s); location.hash = "#sets"; } };
    },
  };
}
/** Ventana para escoger una canción; en misa propone primero las del momento. */
function elegirCancion(momento) {
  return new Promise(res => {
    const dl = document.createElement("dialog");
    dl.innerHTML = `<div class="dlg"><h2>${momento ? "Canción para " + esc(nombreMomento(momento)) : "Agregar canción"}</h2><input class="field" id="ecq" placeholder="Buscar…" autocomplete="off"><ul class="resultados" id="ecr" style="max-height:50vh"></ul><div class="row"><span class="sp"></span><button class="btn ghost" id="ecx">Cancelar</button></div></div>`;
    document.body.appendChild(dl);
    const fin = v => { dl.close(); dl.remove(); res(v); };
    const pinta = () => {
      const q = norm($("#ecq", dl).value);
      const pts = c => (momento && momentoDe(c) === momento ? 0 : 2) + (esLiturgica(c) ? 0 : 1);
      const r = canciones().filter(c => !q || norm(c.titulo + " " + c.autor).includes(q)).sort((a, b) => pts(a) - pts(b) || a.titulo.localeCompare(b.titulo, "es")).slice(0, 40);
      $("#ecr", dl).innerHTML = r.map(c => `<li><button data-c="${c.id}"><span><b>${esc(c.titulo)}</b> <small class="status">${esc(c.autor || "")}</small></span>${momento && momentoDe(c) === momento ? '<span class="chip mio">sugerida</span>' : ""}<span class="chip tono">${esc(c.tono || "")}</span></button></li>`).join("") || `<li class="status" style="padding:10px 12px">Sin resultados</li>`;
      $$("[data-c]", dl).forEach(b => b.onclick = () => fin(D.uno("cif_canciones", b.dataset.c)));
    };
    $("#ecq", dl).oninput = pinta; $("#ecx", dl).onclick = () => fin(null); dl.addEventListener("cancel", () => fin(null));
    pinta(); dl.showModal(); $("#ecq", dl).focus();
  });
}

  return {

function lineasEditor() {
  const lineas = ed.c.contenido.split("\n");
  return lineas.map((lin, li) => {
    const dir = /^\s*\{\s*(c|comment)\s*:\s*(.*?)\s*\}\s*$/i.exec(lin);
    if (dir) return `<div class="edsec" style="--sc:var(${C.colorSeccion(dir[2])})">${esc(dir[2])}</div>`;
    if (/^\s*\{/.test(lin)) return "";
    if (!lin.trim()) return `<div style="height:10px"></div>`;
    // separa letra y acordes
    let letra = "", marcas = {}; const re = /\[([^\]]*)\]/g; let m, ult = 0;
    while ((m = re.exec(lin))) { letra += lin.slice(ult, m.index); (marcas[letra.length] = marcas[letra.length] || []).push(m[1]); ult = re.lastIndex; }
    letra += lin.slice(ult);
    let h = "";
    const tok = /[\p{L}]+|[^\p{L}]+/gu; let t;
    while ((t = tok.exec(letra))) {
      const w = t[0], p0 = t.index;
      if (/^\p{L}/u.test(w)) {
        let p = p0;
        for (const s of C.silabas(w)) {
          const ac = marcas[p]; h += `<button class="sil ${ac ? "con" : ""}" data-l="${li}" data-p="${p}"><span class="a">${ac ? esc(ac.join(" ")) : ""}</span><span class="s">${esc(s)}</span></button>`; p += s.length;
        }
      } else {
        // acordes que caen en espacios o signos
        let k = 0;
        for (let j = 0; j < w.length; j++) { const ac = marcas[p0 + j]; if (ac && j > k) { h += `<span class="gap"><span class="a"></span><span>${esc(w.slice(k, j))}</span></span>`; k = j; } if (ac) { h += `<span class="gap" data-l="${li}" data-p="${p0 + j}"><span class="a"><button class="chipac" data-l="${li}" data-p="${p0 + j}">${esc(ac.join(" "))}</button></span><span>${esc(w.slice(j, j + 1))}</span></span>`; k = j + 1; } }
        if (k < w.length) h += `<span class="gap"><span class="a"></span><span>${esc(w.slice(k))}</span></span>`;
      }
    }
    const fin = marcas[letra.length];
    if (fin) h += `<span class="gap"><span class="a">${fin.map(a => `<button class="chipac" data-l="${li}" data-p="${letra.length}">${esc(a)}</button>`).join("")}</span><span> </span></span>`;
    return `<div class="edlin">${h}<button class="addend" data-l="${li}" data-fin="1" title="Agregar acorde al final">＋</button></div>`;
  }).join("");
}
/** Pone o quita un acorde en la posición p (en la letra sin acordes) de la línea li. */
function ponerAcorde(li, p, ac, alFinal) {
  const lineas = ed.c.contenido.split("\n"), lin = lineas[li];
  let letra = "", marcas = []; const re = /\[([^\]]*)\]/g; let m, ult = 0;
  while ((m = re.exec(lin))) { letra += lin.slice(ult, m.index); marcas.push({ pos: letra.length, s: m[1] }); ult = re.lastIndex; }
  letra += lin.slice(ult);
  if (alFinal) { if (ac) { if (!/\s$/.test(letra) && letra.length) letra += "  "; marcas.push({ pos: letra.length, s: ac }); } }
  else {
    const hay = marcas.filter(x => x.pos === p);
    marcas = marcas.filter(x => x.pos !== p);
    if (ac && !(hay.length === 1 && hay[0].s === ac)) marcas.push({ pos: p, s: ac });
  }
  marcas.sort((a, b) => a.pos - b.pos);
  let out = "", q = 0; marcas.forEach(x => { out += letra.slice(q, x.pos) + "[" + x.s + "]"; q = x.pos; });
  lineas[li] = (out + letra.slice(q)).replace(/\s+$/, "");
  ed.c.contenido = lineas.join("\n");
}

function vSenas() {
  const F = window.SENAS_FOTO;
  const escena = s => {
    const r = F && F.regiones && F.regiones[s.id];
    const foto = r ? `<div class="foto" style="background-image:url('${esc(F.src)}');background-size:${10000 / r.w}% ${10000 / r.h}%;background-position:${r.w >= 100 ? 0 : (r.x / (100 - r.w)) * 100}% ${r.h >= 100 ? 0 : (r.y / (100 - r.h)) * 100}%"></div>` : `<span class="mano">${s.mano}</span>`;
    return `<div class="escena m-${s.mov}" style="--sc:var(${s.sec})">${foto}<span class="let">${esc(s.letra)}</span></div>`;
  };
  return {
    band: bandHTML({ tag: "Manual", titulo: "Señas para <em>dirigir</em>", sub: `<span>Las mismas señas en todos los ministerios</span>`, tabs: "" }),
    main: `<div class="row"><p class="status" style="margin:0;flex:1">Quien dirige las hace al frente, a la altura del pecho, un compás antes del cambio.</p><button class="btn" id="practicar">🎲 Practicar</button></div>
      <div class="senas">${SENAS.map(s => `<article class="sena" style="--sc:var(${s.sec})">${escena(s)}<div class="tx"><h3>${esc(s.nombre)}</h3><p><b>Cuándo:</b> ${esc(s.cuando)}</p><p><b>Cómo:</b> ${esc(s.como)}</p></div></article>`).join("")}</div>
      ${F ? "" : `<p class="status">Las manos son provisionales: cuando llegue la fotografía oficial de señas, cada tarjeta mostrará su recorte animado con el mismo movimiento.</p>`}`,
    after() {
      clearInterval(window._contar); let k = 0;
      window._contar = setInterval(() => { const els = $$(".m-contar .mano"); if (!els.length) return clearInterval(window._contar); k = (k + 1) % 3; els.forEach(x => (x.textContent = ["☝️", "✌️", "🤟"][k])); }, 900);
      $("#practicar").onclick = () => {
        let i = Math.floor(Math.random() * SENAS.length), ver = false;
        const dl = document.createElement("dialog"); document.body.appendChild(dl);
        const pinta = () => { const s = SENAS[i]; dl.innerHTML = `<div class="dlg practica">${ver ? escena(s) : `<div class="escena" style="--sc:var(${s.sec})"><span class="mano" style="font-size:40px">❓</span></div>`}<div class="grande">${ver ? esc(s.nombre) : "¿Qué seña harías para…"}</div><p>${ver ? esc(s.como) : esc(s.cuando)}</p><div class="row"><button class="btn ghost" data-x>Cerrar</button><button class="btn" data-v>${ver ? "Otra →" : "Ver la seña"}</button></div></div>`;
          dl.querySelector("[data-x]").onclick = () => { dl.close(); dl.remove(); };
          dl.querySelector("[data-v]").onclick = () => { if (ver) { i = (i + 1 + Math.floor(Math.random() * (SENAS.length - 1))) % SENAS.length; ver = false; } else ver = true; pinta(); }; };
        pinta(); dl.showModal();
      };
    },
  };
}

/** Ventana «Exportar PDF». conf: {items:[{c,tono,capo,orden,nota,momento,persona}], titulo, subtitulo, multiple, minId, filtros, tonoMio} */
async function abrirExportar(conf) {
  const pr = ls.get("cifrados-pdf", { cols: 1, portada: true, indice: true });
  const marcas = [["", "Tiempo de Dios"], ...(esSuper() ? D.lista("cif_ministerios") : misMins()).sort((a, b) => a.nombre.localeCompare(b.nombre)).map(m => [m.id, m.nombre])];
  const autores = conf.filtros ? [...new Set(canciones().map(c => c.autor).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es")) : [];
  const mins = conf.filtros ? D.lista("cif_ministerios").sort((a, b) => a.nombre.localeCompare(b.nombre)) : [];
  const d = await dialogo(`<h2>Exportar PDF</h2>
    <p>${conf.multiple ? `${conf.items.length} canciones${conf.filtros ? " de la lista actual (con tus filtros)" : ""}.` : `«${esc(conf.titulo)}» en el tono que estás viendo.`} Acordes sobre su sílaba, con el formato de Tiempo de Dios.</p>
    <div class="seg pdfcols" role="radiogroup"><label><input type="radio" name="cols" value="1" ${pr.cols !== 2 ? "checked" : ""}><span>▤ Una columna</span></label><label><input type="radio" name="cols" value="2" ${pr.cols === 2 ? "checked" : ""}><span>▥ Dos columnas</span></label></div>
    <label class="lb">Colores y logo<select class="field" name="marca">${marcas.map(([id, n]) => `<option value="${id}" ${id === (conf.minId || "") ? "selected" : ""}>${esc(n)}</option>`).join("")}</select></label>
    ${conf.multiple ? `<label class="lb">Título<input class="field" name="titulo" value="${esc(conf.titulo || "Cancionero")}"></label>
      <div class="row"><label class="row"><input type="checkbox" name="portada" ${pr.portada ? "checked" : ""}> Portada</label><label class="row"><input type="checkbox" name="indice" ${pr.indice ? "checked" : ""}> Índice</label></div>` : ""}
    ${conf.tonoMio ? `<label class="lb">Tono<select class="field" name="tonos"><option value="orig">El original de cada canción</option><option value="mio">Mi tono cuando lo tengo guardado</option></select></label>` : ""}
    <label class="row"><input type="checkbox" name="soloLetra" ${st.estilo.sinAcordes ? "checked" : ""}> Solo letra (para voces)</label>
    ${conf.filtros ? `<details class="pdffiltro"><summary>Elegir artistas o ministerios</summary><p class="status">Si marcas alguno, se exportan sus canciones en lugar de la lista actual.</p>
      <b>Artistas</b><div class="pdfchk">${autores.map((a, i) => `<label><input type="checkbox" name="a_${i}"> ${esc(a)}</label>`).join("")}</div>
      <b>Ministerios</b><div class="pdfchk">${mins.map(m => `<label><input type="checkbox" name="m_${m.id}"> ${esc(m.nombre)}</label>`).join("")}</div></details>` : ""}`, "Descargar PDF");
  if (!d) return;
  let items = conf.items;
  if (conf.filtros) {
    const aSel = autores.filter((a, i) => d["a_" + i]), mSel = mins.filter(m => d["m_" + m.id]).map(m => m.id);
    if (aSel.length || mSel.length) items = canciones().filter(c => aSel.includes(c.autor) || mSel.includes(c.ministerio_id)).map(c => ({ c }));
    if (aSel.length || mSel.length) d.titulo = d.titulo && d.titulo !== (conf.titulo || "Cancionero") ? d.titulo : "Cancionero · " + aSel.concat(mSel.map(nombreMin)).join(", ");
  }
  if (!items.length) return toast("No hay canciones para exportar.");
  if (d.tonos === "mio") items = items.map(x => { const t = miTono(x.c.id); return t ? { ...x, tono: t.tono, capo: t.capo || 0 } : x; });
  const cols = +d.cols === 2 ? 2 : 1;
  ls.set("cifrados-pdf", { cols, portada: !!d.portada, indice: !!d.indice });
  toast(items.length > 20 ? `Armando el PDF de ${items.length} canciones…` : "Armando el PDF…");
  try {
    const pags = await PDF.exportar({ canciones: items, titulo: conf.multiple ? d.titulo : conf.titulo, subtitulo: conf.subtitulo, marca: await marcaDe(d.marca || null),
      cols, portada: conf.multiple && !!d.portada, indice: conf.multiple && !!d.indice, notacion: st.estilo.notacion, soloLetra: !!d.soloLetra });
    toast(`PDF listo: ${pags} página${pags === 1 ? "" : "s"}.`);
  } catch (e) { console.error(e); toast("No se pudo armar el PDF: " + (e.message || e)); }
}

/** Achica el logo (máx. 320 px, conserva transparencia en PNG). */
function logoChico(archivo) {
  return new Promise((ok, mal) => {
    const img = new Image(), url = URL.createObjectURL(archivo);
    img.onload = () => {
      const k = Math.min(1, 320 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); ok(c.toDataURL("image/png"));
    };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error("No pude leer esa imagen.")); };
    img.src = url;
  });
}

        const d = await dialogo(`<h2>¿Borrar ${esc(m.nombre)}?</h2><p>Se borran sus sets, integrantes y solicitudes. La librería y los tonos no se tocan. No se puede deshacer.</p><label class="lb">Escribe el nombre para confirmar<input class="field" name="conf" autocomplete="off"></label>`, "Borrar");
        if (!d) return;
        if (norm(d.conf) !== norm(m.nombre)) return toast("El nombre no coincide; no se borró.");
        await D.borrar("cif_ministerios", m);
        // lo dependiente se borra en cascada en la nube; aquí se limpia la copia local
        D.lista("cif_miembros").filter(x => x.ministerio_id === m.id).forEach(x => D.aplicarLocal("cif_miembros", [x], true));
        D.lista("cif_sets").filter(x => x.ministerio_id === m.id).forEach(x => D.aplicarLocal("cif_sets", [x], true));
        D.lista("cif_solicitudes").filter(x => x.ministerio_id === m.id).forEach(x => D.aplicarLocal("cif_solicitudes", [x], true));
        toast(`«${m.nombre}» se borró.`);
      });
      $$("[data-pide]").forEach(b => b.onclick = async () => {
        const m = D.uno("cif_ministerios", b.dataset.pide);
        const d = await dialogo(`<h2>Unirme a ${esc(m.nombre)}</h2><p>Un admin del ministerio o el desarrollador revisará tu solicitud.</p><label class="lb">Mensaje (opcional)<input class="field" name="mensaje" placeholder="Canto en el coro de los domingos…"></label>`, "Enviar solicitud");
        if (!d) return;
        const s = await D.guardar("cif_solicitudes", { ministerio_id: m.id, persona_id: yo().id, mensaje: d.mensaje || null, estado: "pendiente" });
        toast("Solicitud enviada. Te avisamos por correo cuando te acepten.");
        avisarCorreo("aviso_solicitud", s.id);
      });
      $$("[data-cancela]").forEach(b => b.onclick = () => { D.lista("cif_solicitudes").filter(s => s.ministerio_id === b.dataset.cancela && s.persona_id === yo().id && s.estado === "pendiente").forEach(s => D.borrar("cif_solicitudes", s)); });
      $$("[data-acepta]").forEach(b => b.onclick = async () => {
        const s = D.uno("cif_solicitudes", b.dataset.acepta), sel = $(`[data-solrol="${s.id}"]`), rol = sel ? sel.value : "musico";
        await D.guardar("cif_miembros", { ministerio_id: s.ministerio_id, persona_id: s.persona_id, rol });
        await D.guardar("cif_solicitudes", { ...s, estado: "aceptada" });
        toast(`${nombreDe(s.persona_id)} ya es parte del ministerio (${ROL_TXT[rol].toLowerCase()}).`);
        avisarCorreo("aviso_respuesta", s.id);
      });
      $$("[data-rechaza]").forEach(b => b.onclick = async () => { const s = D.uno("cif_solicitudes", b.dataset.rechaza); await D.guardar("cif_solicitudes", { ...s, estado: "rechazada" }); toast("Solicitud rechazada."); avisarCorreo("aviso_respuesta", s.id); });
      $$("[data-invita]").forEach(f => f.onsubmit = async e => {
        e.preventDefault();
        const m = f.dataset.invita, email = f.email.value.trim(), nombre = f.nombre.value.trim();
        try {
          const r = await D.fn("usuarios", { accion: "invitar", email, nombre, ministerio_id: m, rol: "musico", redirectTo: location.origin + location.pathname });
          toast(r.existia ? `${email} ya tenía cuenta: quedó agregado al ministerio.` : `Invitación enviada a ${email}.`);
          f.reset(); D.sincronizar();
        } catch (er) { toast(er.message); }
      });
      $$("[data-rol]").forEach(s => s.onchange = () => { const [m, p] = s.dataset.rol.split("|"); s.blur(); D.guardar("cif_miembros", { ...D.uno("cif_miembros", m + "|" + p), rol: s.value }); });
      $$("[data-saca]").forEach(b => b.onclick = async () => { const [m, p] = b.dataset.saca.split("|"); if (await confirmar(`¿Quitar a ${nombreDe(p)} del ministerio?`)) D.borrar("cif_miembros", { ministerio_id: m, persona_id: p }); });
      $$("[data-agrega]").forEach(b => b.onclick = async () => {
        const inp = $(`[data-nuevo="${b.dataset.agrega}"]`), n = inp.value.trim(); if (!n) return;
        const p = await D.guardar("cif_perfiles", { id: D.uuid(), nombre: n, usuario: norm(n).replace(/[^a-z0-9]+/g, "."), artista: true, estilo: {} });
        await D.guardar("cif_miembros", { ministerio_id: b.dataset.agrega, persona_id: p.id, rol: "musico" });
      });
    },
  };
}

/** Manda un aviso por correo cuando el cambio ya subió a la nube (si falla, no estorba). */
async function avisarCorreo(accion, solicitud_id) {
  if (!D.nube) return;
  for (let i = 0; i < 40 && D.estado.pendientes > 0; i++) await new Promise(r => setTimeout(r, 250));
  try { await D.fn("usuarios", { accion, solicitud_id }); } catch (e) { console.warn("aviso por correo:", e.message); }
}

// ================= USUARIOS (desarrollador) =================
// Todas las cuentas: invitar, crear con contraseña, reenviar, quitar, nombrar desarrollador y asignar ministerios.
const cuentas = { lista: null, cargando: false, error: "", q: "" };
async function cargarCuentas() {
  if (!D.nube || cuentas.cargando) return;
  cuentas.cargando = true; cuentas.error = "";
  try { cuentas.lista = (await D.fn("usuarios", { accion: "listar" })).usuarios; } catch (e) { cuentas.error = e.message; }
  cuentas.cargando = false; render();
}
const fechaCorta = iso => iso ? new Date(iso).toLocaleDateString("es-MX", { day: "numeric", month: "short", year: "2-digit" }) : "";
function vUsuarios() {
  if (!esSuper()) return { band: bandHTML({ titulo: "Usuarios" }), main: `<p>Solo el desarrollador administra las cuentas.</p>` };
  if (D.nube && !cuentas.lista && !cuentas.cargando && !cuentas.error) setTimeout(cargarCuentas, 0);
  const porId = new Map((cuentas.lista || []).map(u => [u.id, u]));
  const perfiles = D.lista("cif_perfiles");
  // une cuentas de Auth con perfiles (en modo local solo hay perfiles)
  const ids = [...new Set(perfiles.map(p => p.id).concat([...porId.keys()]))];
  const q = norm(cuentas.q);
  const filas = ids.map(id => ({ id, p: D.uno("cif_perfiles", id) || {}, u: porId.get(id) || {} }))
    .filter(x => !q || norm((x.p.nombre || "") + " " + (x.p.usuario || "") + " " + (x.u.email || "")).includes(q))
    .sort((a, b) => (a.p.nombre || a.u.email || "").localeCompare(b.p.nombre || b.u.email || "", "es"));
  const mins = D.lista("cif_ministerios").sort((a, b) => a.nombre.localeCompare(b.nombre));
  const estado = u => !D.nube || !u.id ? "" : u.ultimo ? `<span class="chip pista">Activo · ${fechaCorta(u.ultimo)}</span>` : u.invitado ? `<span class="chip mio">Invitado · sin entrar</span>` : u.confirmado ? `<span class="chip">Nunca ha entrado</span>` : `<span class="chip mio">Sin confirmar correo</span>`;
  const fila = ({ id, p, u }) => {
    const ms = D.lista("cif_miembros").filter(m => m.persona_id === id);
    return `<li class="ucard">${avatar(p, u.email)}
      <div class="uinfo"><b><a href="#persona/${id}">${esc(p.nombre || "(sin nombre)")}</a></b>${p.usuario ? ` <small class="status">@${esc(p.usuario)}</small>` : ""}${p.superadmin ? ' <span class="chip mio">Desarrollador</span>' : ""}
        <small class="status">${esc(u.email || "")}${u.creado ? " · alta " + fechaCorta(u.creado) : ""}</small>
        <div class="row" style="gap:6px;margin-top:4px">${estado(u)}${ms.map(m => `<span class="chip minrol">${esc((D.uno("cif_ministerios", m.ministerio_id) || {}).nombre || "?")} <select data-urol="${m.ministerio_id}|${id}" aria-label="Rol">${["admin", "musico", "lector"].map(r => `<option value="${r}" ${r === m.rol ? "selected" : ""}>${{ admin: "Admin", musico: "Músico", lector: "Solo ver" }[r]}</option>`).join("")}</select><button class="xmini" data-umsaca="${m.ministerio_id}|${id}" title="Quitar del ministerio">✕</button></span>`).join("")}</div></div>
      <div class="uacc">
        <select class="fsel" data-umin="${id}" aria-label="Agregar a ministerio"><option value="">＋ Ministerio…</option>${mins.filter(m => !ms.some(x => x.ministerio_id === m.id)).map(m => `<option value="${m.id}">${esc(m.nombre)}</option>`).join("")}</select>
        ${D.nube && u.email ? `<button class="btn xs ghost" data-ureenv="${id}" title="${u.ultimo ? "Manda liga para cambiar contraseña" : "Manda otra vez la invitación"}">${u.ultimo ? "Liga de contraseña" : "Reenviar invitación"}</button>` : ""}
        ${D.nube && yo() && id !== yo().id ? `<button class="btn xs ghost" data-uquita="${id}">Borrar cuenta</button>` : ""}
      </div></li>`;
  };
  return {
    band: bandHTML({ tag: "Desarrollador", titulo: "Usuarios", sub: `<span><b>${ids.length}</b> cuentas</span><span>${D.nube ? "Las altas hechas en Supabase → Authentication también aparecen aquí" : "Modo local: sin cuentas reales"}</span>` }),
    main: `
      ${D.nube ? `<section class="caja"><h3>Dar de alta</h3><p>Con <b>invitación</b> le llega un correo para crear su contraseña. Con <b>contraseña</b> la cuenta queda lista sin correo (útil mientras no esté el SMTP propio): pásale la contraseña en persona.</p>
        <form class="ualta" id="ualta">
          <input class="field" name="email" type="email" placeholder="correo@…" required autocomplete="off" data-1p-ignore data-lpignore="true">
          <input class="field" name="nombre" placeholder="Nombre" autocomplete="off" data-1p-ignore data-lpignore="true">
          <select class="field" name="ministerio"><option value="">Sin ministerio</option>${mins.map(m => `<option value="${m.id}" ${minActual() && m.id === minActual().id ? "selected" : ""}>${esc(m.nombre)}</option>`).join("")}</select>
          <select class="field" name="rol"><option value="musico">Músico</option><option value="admin">Admin</option><option value="lector">Solo ver</option></select>
          <input class="field" name="password" type="text" placeholder="Contraseña (opcional, mín. 8)" autocomplete="off">
          <button class="btn" name="modo" value="invitar">Enviar invitación</button>
          <button class="btn ghost" name="modo" value="crear" type="submit">Crear con contraseña</button>
        </form></section>` : ""}
      <div class="row"><input class="field" id="uq" type="search" placeholder="Buscar por nombre, @usuario o correo…" value="${esc(cuentas.q)}" style="flex:1"><button class="btn ghost" id="urec" ${D.nube ? "" : "hidden"}>${cuentas.cargando ? "Cargando…" : "↻ Actualizar"}</button></div>
      ${cuentas.error ? `<div class="empty"><strong>No se pudieron leer las cuentas</strong><p>${esc(cuentas.error)}</p><p>Revisa que la función <b>usuarios</b> esté desplegada en Supabase (README → «Panel de usuarios»).</p></div>` : ""}
      <ul class="ulista">${filas.map(fila).join("") || `<li class="status">Sin resultados</li>`}</ul>`,
    after() {
      const uq = $("#uq"); uq.oninput = () => { cuentas.q = uq.value; const pos = uq.selectionStart; render(); const n = $("#uq"); n.focus(); n.setSelectionRange(pos, pos); };
      const rec = $("#urec"); if (rec) rec.onclick = () => { cuentas.lista = null; cargarCuentas(); render(); };
      const f = $("#ualta");
      if (f) f.onsubmit = async e => {
        e.preventDefault();
        const modo = (e.submitter && e.submitter.value) || "invitar";
        const body = { accion: modo, email: f.email.value.trim(), nombre: f.nombre.value.trim(), ministerio_id: f.ministerio.value || null, rol: f.rol.value, password: f.password.value, redirectTo: location.origin + location.pathname };
        if (modo === "crear" && body.password.length < 8) return toast("Para crear con contraseña escribe una de al menos 8 caracteres.");
        try {
          const r = await D.fn("usuarios", body);
          toast(r.existia ? "Ya tenía cuenta: quedó agregado al ministerio." : modo === "crear" ? `Cuenta creada para ${body.email}. Pásale su contraseña.` : `Invitación enviada a ${body.email}.`);
          f.reset(); cuentas.lista = null; await D.sincronizar(); cargarCuentas();
        } catch (er) { toast(er.message); }
      };
      $$("[data-umin]").forEach(s => s.onchange = async () => { const id = s.dataset.umin, m = s.value; s.blur(); if (!m) return; await D.guardar("cif_miembros", { ministerio_id: m, persona_id: id, rol: "musico" }); toast(`${nombreDe(id)} agregado como músico.`); });
      $$("[data-umsaca]").forEach(b => b.onclick = async () => { const [m, id] = b.dataset.umsaca.split("|"); if (await confirmar(`¿Quitar a ${nombreDe(id)} de ${(D.uno("cif_ministerios", m) || {}).nombre}?`)) D.borrar("cif_miembros", { ministerio_id: m, persona_id: id }); });
      // rol en cada ministerio (p. ej. hacer a Edgar admin de Kairós para que acepte solicitudes)
      $$("[data-urol]").forEach(s => s.onchange = async () => {
        const [m, id] = s.dataset.urol.split("|"); s.blur();
        await D.guardar("cif_miembros", { ...D.uno("cif_miembros", m + "|" + id), rol: s.value });
        toast(`${nombreDe(id)} ahora es ${{ admin: "admin", musico: "músico", lector: "solo ver" }[s.value]} en ${nombreMin(m)}.`);
      });
      $$("[data-ureenv]").forEach(b => b.onclick = async () => { try { const r = await D.fn("usuarios", { accion: "reenviar", id: b.dataset.ureenv, redirectTo: location.origin + location.pathname }); toast(r.tipo === "recuperar" ? "Le mandamos una liga para cambiar su contraseña." : "Invitación reenviada."); } catch (er) { toast(er.message); } });
      $$("[data-uquita]").forEach(b => b.onclick = async () => {
        const id = b.dataset.uquita;
        if (!(await confirmar(`¿Borrar la cuenta de ${nombreDe(id)}?`, "Pierde el acceso y se borran sus tonos guardados. No se puede deshacer."))) return;
        try { await D.fn("usuarios", { accion: "quitar", id }); toast("Cuenta borrada."); cuentas.lista = null; await D.sincronizar(); cargarCuentas(); } catch (er) { toast(er.message); }
      });
    },
  };
}

// ================= AMIGOS =================
// Solicitudes de amistad (como en redes sociales) para tener a la mano los tonos de otras personas.
let busquedaAmigos = { q: "", res: null };
function vAmigos() {
  const ams = amigos().map(id => D.uno("cif_perfiles", id) || { id, nombre: "Alguien" }).sort((a, b) => (a.nombre || "").localeCompare(b.nombre || ""));
  const recibidas = pendAmigos(), enviadas = yo() ? D.lista("cif_amistades").filter(a => a.estado === "pendiente" && a.de === yo().id) : [];
  const nTonos = id => D.lista("cif_tonos").filter(t => t.persona_id === id).length;
  const persona = (p, extra) => `<li>${avatar(p)}<span><a href="#persona/${p.id}"><b>${esc(p.nombre || "Sin nombre")}</b></a>${p.usuario ? ` <small class="status">@${esc(p.usuario)}</small>` : ""}<br><small class="status">${nTonos(p.id)} tonos guardados</small></span>${extra || ""}</li>`;
  const res = busquedaAmigos.res;
  return {
    band: bandHTML({ tag: "Equipo", titulo: "Amigos y <em>sus tonos</em>", sub: `<span>Agrega a quien quieras para ver en qué tono canta cada canción</span>` }),
    main: `
      <section class="caja"><h3>Buscar personas</h3><p>Por @usuario, nombre o correo exacto.</p>
        <form class="row" id="fbus"><input class="field" id="abq" value="${esc(busquedaAmigos.q)}" placeholder="@alvaro, Ceci, correo@…" style="flex:1" autocomplete="off"><button class="btn">Buscar</button></form>
        ${res ? (res.length ? `<ul class="miembros" style="margin-top:12px">${res.map(p => { const a = amistadCon(p.id); return persona(p, a ? `<span class="chip">${a.estado === "aceptada" ? "Amigos" : "Pendiente"}</span>` : `<button class="btn xs" data-pedir="${p.id}">＋ Agregar</button>`); }).join("")}</ul>` : `<p class="status" style="margin-top:10px">No encontré a nadie con «${esc(busquedaAmigos.q)}».</p>`) : ""}
      </section>
      ${recibidas.length ? `<section class="caja"><h3>Te quieren agregar (${recibidas.length})</h3><ul class="miembros">${recibidas.map(a => persona(D.uno("cif_perfiles", a.de) || { id: a.de, nombre: "Alguien" }, `<button class="btn xs" data-aceptar="${a.id}">Aceptar</button><button class="btn xs ghost" data-borrar="${a.id}">Rechazar</button>`)).join("")}</ul></section>` : ""}
      <section class="caja"><h3>Mis amigos (${ams.length})</h3>${ams.length ? `<ul class="miembros">${ams.map(p => persona(p, `<button class="btn xs ghost" data-borrar="${amistadCon(p.id).id}" title="Quitar amigo">✕</button>`)).join("")}</ul>` : `<p>Aún no tienes amigos agregados. Sus tonos aparecerán arriba de cada canción, junto a los de tu ministerio.</p>`}</section>
      ${enviadas.length ? `<section class="caja"><h3>Enviadas</h3><ul class="miembros">${enviadas.map(a => persona(D.uno("cif_perfiles", a.para) || { id: a.para, nombre: "Alguien" }, `<span class="chip">Pendiente</span><button class="btn xs ghost" data-borrar="${a.id}">Cancelar</button>`)).join("")}</ul></section>` : ""}`,
    after() {
      $("#fbus").onsubmit = async e => {
        e.preventDefault(); const q = $("#abq").value.trim(); busquedaAmigos.q = q; if (q.length < 2) return;
        try {
          if (D.nube) busquedaAmigos.res = await D.rpc("cif_buscar_persona", { q });
          else { const n = norm(q.replace(/^@/, "")); busquedaAmigos.res = D.lista("cif_perfiles").filter(p => p.id !== yo().id && (norm(p.nombre).includes(n) || norm(p.usuario) === n)); }
        } catch (er) { toast(er.message); busquedaAmigos.res = []; }
        $("#abq").blur(); render();
      };
      $$("[data-pedir]").forEach(b => b.onclick = async () => {
        // en modo local no hay otra persona que acepte: queda aceptada
        await D.guardar("cif_amistades", { de: yo().id, para: b.dataset.pedir, estado: D.nube ? "pendiente" : "aceptada" });
        toast(D.nube ? "Solicitud enviada." : "Agregado.");
      });
      $$("[data-aceptar]").forEach(b => b.onclick = () => { const a = D.uno("cif_amistades", b.dataset.aceptar); D.guardar("cif_amistades", { ...a, estado: "aceptada" }); toast("¡Ahora son amigos!"); });
      $$("[data-borrar]").forEach(b => b.onclick = () => { const a = D.uno("cif_amistades", b.dataset.borrar); if (a) D.borrar("cif_amistades", a); });
    },
  };
}

// ================= PERSONA (sus tonos) =================
function vPersona(id) {
  if (id === "yo" && yo()) id = yo().id;

  const soyYo = yo() && id === yo().id, a = amistadCon(id);
  const tonos = D.lista("cif_tonos").filter(t => t.persona_id === id).map(t => ({ t, c: D.uno("cif_canciones", t.cancion_id) })).filter(x => x.c && !x.c.borrada).sort((x, y) => x.c.titulo.localeCompare(y.c.titulo, "es"));
  const mins = D.lista("cif_miembros").filter(m => m.persona_id === id).map(m => (D.uno("cif_ministerios", m.ministerio_id) || {}).nombre).filter(Boolean);
  const favs = (p.favoritas || []).map(cid => D.uno("cif_canciones", cid)).filter(c => c && !c.borrada && veCancion(c));
  return {
    band: bandHTML({ tag: soyYo ? "Mis tonos" : "Perfil", titulo: esc(p.nombre || "Sin nombre"), sub: [p.usuario && `<span>@${esc(p.usuario)}</span>`, p.voz && `<span>${esc(p.voz)}</span>`, mins.length && `<span>${esc(mins.join(" · "))}</span>`, `<span><b>${tonos.length}</b> tonos</span>`].filter(Boolean).join("") }),
    main: `<section class="carta">${avatar(p, "", "grande")}<div>
        ${p.bio ? `<p class="bio">${esc(p.bio)}</p>` : `<p class="status">${soyYo ? "Aún no escribes tu descripción." : "Sin descripción."}</p>`}
        ${favs.length ? `<div class="favs"><b>❤️ Canciones favoritas</b><div class="row" style="gap:6px">${favs.map(c => `<a class="chip fav" href="#cancion/${c.id}">${esc(c.titulo)}</a>`).join("")}</div></div>` : ""}
        ${soyYo ? `<a class="btn xs ghost" href="#perfil" style="margin-top:8px">✎ Editar mi perfil</a>` : ""}</div></section>
      ${!soyYo && !a && yo() ? `<div class="row"><button class="btn" id="pamigo">＋ Agregar como amigo</button></div>` : ""}
      <h2 class="status" style="margin:0">TONOS GUARDADOS</h2>
      ${tonos.length ? `<ul class="songs">${tonos.map(({ t, c }) => `<li><a class="srow" href="#cancion/${c.id}" data-vertono="${esc(t.tono)}" data-capo="${t.capo || 0}" data-cid="${c.id}"><div><b>${esc(c.titulo)}</b><small>${esc(c.autor || "—")} · original ${esc(c.tono || "")}</small></div><span class="chips"><span class="chip mio">★ ${esc(t.tono)}${t.capo ? " · capo " + t.capo : ""}</span></span></a></li>`).join("")}</ul>`
        : `<div class="empty"><strong>${soyYo ? "Aún no guardas tonos" : "Sin tonos guardados"}</strong><p>${soyYo ? "Abre una canción, ponla en tu tono y toca «★ Este es mi tono». Queda en tu perfil y lo ve tu equipo." : "Cuando guarde tonos aparecerán aquí."}</p></div>`}`,
    after() {
      const b = $("#pamigo"); if (b) b.onclick = async () => { await D.guardar("cif_amistades", { de: yo().id, para: id, estado: D.nube ? "pendiente" : "aceptada" }); toast(D.nube ? "Solicitud enviada." : "Agregado."); };
      // al abrir desde aquí, la canción se ve en el tono de esta persona
      $$("[data-vertono]").forEach(x => x.onclick = () => { st.tonoVista[x.dataset.cid] = x.dataset.vertono; st.capo[x.dataset.cid] = +x.dataset.capo; });
    },
  };
}

// favoritas en edición (se reinicia al guardar o al salir del perfil)
let favEd = null;
function favoritasHTML() {

// ================= IMPORTAR / EXPORTAR =================
let zipP = null;
function cargarZip() {
  if (window.JSZip) return Promise.resolve();
  if (!zipP) zipP = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"; s.onload = res; s.onerror = () => { zipP = null; rej(new Error("No se pudo cargar el lector de .sbp")); }; document.head.appendChild(s); });
  return zipP;
}
async function abrirImportar() {
  if (!suscrito()) return toast("Importar requiere un ministerio con suscripción activa.");
  const d = await dialogo(`<h2>Importar</h2><p>Respaldo de Cifrados (.json), exportación de SongbookPro (.sbp), archivos ChordPro (.cho, .chopro, .txt) o texto con acordes arriba.</p>
    <input type="file" name="archivos" accept=".json,.sbp,.cho,.chopro,.chordpro,.txt,.pro" multiple class="field" style="padding-top:10px">
    <label class="row" style="font-weight:600"><input type="checkbox" name="silabas" checked> Pegar cada acorde al inicio de su sílaba (recomendado)</label>
    <label class="row" style="font-weight:600"><input type="checkbox" name="dups" checked> Saltar las que ya están (mismo título y letra)</label>`, "Importar", true);
  if (!d || !d.archivos || !d.archivos.length) return;
  try {
    let nuevas = [];
    for (const f of d.archivos) {
      if (/\.json$/i.test(f.name)) { await restaurarRespaldo(JSON.parse(await f.text())); continue; }
      if (/\.sbp$/i.test(f.name)) nuevas = nuevas.concat(await leerSbp(f));
      else { const tx = await f.text(); nuevas.push(deTexto(tx, f.name)); }
    }
    const exist = new Set(canciones().map(c => norm(c.titulo) + "|" + norm(c.contenido.replace(/\[[^\]]*\]|\s+/g, "")).slice(0, 200)));
    let n = 0, saltadas = 0, movidas = 0;
    if (!nuevas.length) { render(); return; }
    for (const c of nuevas) {
      if (/^misa\b/i.test(c.titulo) && !(c.etiquetas || []).some(t => norm(t).startsWith("liturg"))) c.etiquetas = (c.etiquetas || []).concat("Litúrgica");
      if (d.silabas) { const a = C.ajustarASilabas(c.contenido); if (a !== c.contenido) movidas++; c.contenido = a; }
      const k = norm(c.titulo) + "|" + norm(c.contenido.replace(/\[[^\]]*\]|\s+/g, "")).slice(0, 200);
      if (d.dups && exist.has(k)) { saltadas++; continue; }
      exist.add(k);
      c.ministerio_id = minActual() ? minActual().id : null;
      await D.guardar("cif_canciones", c); n++;
    }
    toast(`${n} canciones importadas${saltadas ? `, ${saltadas} repetidas se saltaron` : ""}${movidas ? `; en ${movidas} se acomodaron acordes a la sílaba` : ""}.`);
    location.hash = "#libreria"; render();
  } catch (e) { console.error(e); toast("No se pudo importar: " + (e.message || e)); }
}
/** Saca BPM, tonos por persona y capo que en SongbookPro se escribían dentro de la letra. */
function limpiarEncabezado(contenido) {
  const lineas = contenido.split("\n"), notas = []; let bpm = null, i = 0;
  for (; i < lineas.length; i++) {
    const l = lineas[i].trim();
    if (!l) continue;
    if (/^\{/.test(l) || /\[/.test(l)) break;
    const b = /BPM\s*:?\s*(\d{2,3})/i.exec(l);
    if (b && !bpm) bpm = +b[1];
    if (/^(tono|bpm|capo|\(?guitarristas|key|tempo)/i.test(l) || /\|/.test(l) && /tono/i.test(l)) { notas.push(l); continue; }
    break;
  }
  return { contenido: lineas.slice(i).join("\n").replace(/^\n+/, ""), notas: notas.join("\n"), bpm };
}
async function leerSbp(f) {
  await cargarZip();
  const zip = await JSZip.loadAsync(f);
  const ent = zip.file("dataFile.txt"); if (!ent) throw new Error("El .sbp no trae dataFile.txt");
  const raw = await ent.async("string");
  const json = JSON.parse(raw.slice(raw.indexOf("{")));
  return (json.songs || []).filter(s => !s.Deleted).map(s => {
    const h = limpiarEncabezado(s.content || "");
    const notas = [h.notas, s.NotesText, s.Capo ? `Capo ${s.Capo} (SongbookPro)` : "", s.Copyright].filter(Boolean).join("\n");
    return { titulo: (s.name || "Sin título").trim(), autor: (s.author || "").trim(), tono: C.tonoDeSbp(s.key) || C.adivinaTono(s.content), bpm: s.TempoInt || h.bpm || null, compas: s.timeSig || "",
      contenido: h.contenido, orden: [], etiquetas: JSON.parse(s._tags || "[]"), liga: s.Url || "", notas, origen: "songbookpro" };
  });
}
function deTexto(tx, nombre) {
  let titulo = nombre.replace(/\.[^.]+$/, ""), autor = "", tono = "";
  const t = /\{\s*(?:t|title)\s*:\s*(.*?)\s*\}/i.exec(tx); if (t) titulo = t[1];
  const a = /\{\s*(?:st|subtitle|artist)\s*:\s*(.*?)\s*\}/i.exec(tx); if (a) autor = a[1];
  const k = /\{\s*key\s*:\s*(.*?)\s*\}/i.exec(tx); if (k) tono = k[1];
  let contenido = tx.replace(/^\s*\{\s*(t|title|st|subtitle|artist|key)\s*:.*\}\s*$/gim, "").trim();
  if (!/\[[^\]]+\]/.test(contenido)) contenido = C.deAcordesArriba(contenido);
  return { titulo, autor, tono: tono || C.adivinaTono(contenido), contenido, orden: [], etiquetas: [], notas: "", origen: "archivo" };
}
/** Restaura un respaldo: canciones (por id), mis tonos y los sets de mis ministerios. Gana lo más reciente. */
async function restaurarRespaldo(data) {
  if (!data || data.app !== "cifrados-tdd") throw new Error("Ese .json no es un respaldo de Cifrados.");
  const mins = new Set(misMins().map(m => m.id));
  let nc = 0, nt = 0, ns = 0;
  for (const c of data.canciones || []) { const act = D.uno("cif_canciones", c.id); if (!act || (c.actualizado || "") > (act.actualizado || "")) { await D.guardar("cif_canciones", c); nc++; } }
  for (const t of data.tonos || []) { if (yo() && (t.persona_id === yo().id || esSuper()) && D.uno("cif_canciones", t.cancion_id)) { await D.guardar("cif_tonos", t); nt++; } }
  for (const s of data.sets || []) { if (mins.has(s.ministerio_id)) { const act = D.uno("cif_sets", s.id); if (!act || (s.actualizado || "") > (act.actualizado || "")) { await D.guardar("cif_sets", s); ns++; } } }
  toast(`Respaldo restaurado: ${nc} canciones, ${nt} tonos, ${ns} sets.`);
}
function exportar() {
  if (!suscrito()) return toast("Exportar requiere un ministerio con suscripción activa.");
  const mins = new Set(misMins().map(m => m.id));
  const data = { app: "cifrados-tdd", version: 2, fecha: new Date().toISOString(), canciones: canciones(), tonos: D.lista("cif_tonos"), tracks: D.lista("cif_tracks"),
    sets: D.lista("cif_sets").filter(s => !s.borrada && mins.has(s.ministerio_id)), ministerios: misMins() };
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 1)], { type: "application/json" }));
  a.download = `cifrados-respaldo-${data.fecha.slice(0, 10)}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function dialogo(html, ok = "Aceptar", conArchivos = false) {
  return new Promise(res => {
    const dl = document.createElement("dialog");
    dl.innerHTML = `<form class="dlg" method="dialog">${html}<div class="row"><span class="sp"></span><button class="btn ghost" value="no" type="button" data-no>Cancelar</button><button class="btn" value="ok">${ok}</button></div></form>`;
    document.body.appendChild(dl);
    const f = dl.querySelector("form");
    const fin = v => { dl.close(); dl.remove(); res(v); };
    dl.querySelector("[data-no]").onclick = () => fin(null);
    dl.addEventListener("cancel", () => fin(null));
    f.onsubmit = e => {
      e.preventDefault(); const out = {};
      $$("input,select,textarea", f).forEach(x => { if (!x.name) return; if (x.type === "radio") { if (x.checked) out[x.name] = x.value; return; } out[x.name] = x.type === "checkbox" ? x.checked : x.type === "file" ? [...x.files] : x.value.trim(); });
      fin(out);
    };
    dl.showModal(); const pri = f.querySelector("input:not([type=checkbox]),select"); if (pri) pri.focus();
  });
}
function confirmar(titulo, texto = "") { return dialogo(`<h2>${esc(titulo)}</h2>${texto ? `<p>${esc(texto)}</p>` : ""}`, "Sí").then(Boolean); }

// ================= RED LOCAL: entrar y panel de conexión =================
// Pantalla al abrir la app desde el servidor de red: PIN (lo muestra la compu que dirige) y «¿quién eres?».
function vRedEntrar() {

    ${!conPin ? `<label class="lb">PIN de la red <small>Aparece en la compu de quien dirige</small><input class="field" name="pin" inputmode="numeric" maxlength="8" autocomplete="off" required style="font:500 22px var(--mono);letter-spacing:.3em;text-align:center"></label><button class="btn">Entrar</button>`
      : `<label class="lb">¿Quién eres?<select class="field" name="yo"><option value="">Elige tu nombre…</option>${gente.map(p => `<option value="${p.id}">${esc(p.nombre || "Sin nombre")}${p.usuario ? " · @" + esc(p.usuario) : ""}</option>`).join("")}<option value="__nuevo">✎ No estoy en la lista</option></select></label>

function enlazarRedEntrar() {
  const f = $("#fred"), msg = $("#rmsg");
  if (f.yo) f.yo.onchange = () => { $("#rnuevo").hidden = f.yo.value !== "__nuevo"; };
  const otro = $("#rpinotro"); if (otro) otro.onclick = () => { try { localStorage.removeItem("cifrados-red-pin"); } catch (e) {} render(); };
  f.onsubmit = async e => {
    e.preventDefault(); msg.textContent = "…";

      if (f.pin) { await D.entrarRed(f.pin.value.trim()); render(); return; }

      if (!id) return (msg.textContent = "Elige tu nombre.");

  const pinta = () => {
    const modo = D.modo;
    dl.innerHTML = `<div class="dlg"><h2>Conexión</h2>
      <div class="cxmodos">
        <section class="cxm ${!navigator.onLine || (modo === "red" && !e.redOk) ? "act" : ""}"><b>📴 Sin internet</b>
          <p>Siempre activo: todo queda guardado en este dispositivo. Al volver la conexión se sube solo.${e.pendientes ? ` <b>${e.pendientes} cambio(s) por subir.</b>` : ""}</p></section>
        <section class="cxm ${modo === "nube" && navigator.onLine ? "act" : ""}"><b>☁️ En línea</b>

              <p class="status">Para que otros entren: misma red y abrir <b>${esc(location.origin)}</b> con el PIN.</p>
              <div class="row"><button class="btn sm" data-cx="recargar">Volver a cargar todo</button></div>`
            : `<p>Para tocar sin internet: en la compu de quien dirige corre el servidor de red (<code>node red/servidor.js</code>). Todos se conectan a la misma red (un router aunque no tenga internet) y abren la dirección que muestra, con su PIN.</p>
              ${modo === "nube" ? `<p class="status">En esa misma compu, desde aquí:</p>
              <div class="row"><input class="field" id="cxbase" value="${esc(ls.get("cifrados-red-base", "http://localhost:8787"))}" style="flex:1;min-width:200px;height:38px"></div>
              <div class="row" style="margin-top:8px"><button class="btn sm" data-cx="enviar">⬆ Enviar mi copia a la red</button>${puedeAvisar() ? `<button class="btn sm" data-cx="avisar">📣 Avisar a todos</button>` : ""}<button class="btn sm ghost" data-cx="traer">⬇ Traer cambios de la red a la nube</button></div>` : ""}`}
          ${anunciosRed().length ? `<div class="cxavisos"><b>Redes activas</b>${anunciosRed().map(a => `<div class="row"><span>📡 ${esc(a.ministerio_id ? nombreMin(a.ministerio_id) : "Todos")}${a.datos.wifi ? " · Wi-Fi «" + esc(a.datos.wifi) + "»" : ""}</span><span class="sp"></span><button class="btn xs" data-verav="${a.id}">Ver datos</button>${puedeAvisar(a.ministerio_id) ? `<button class="btn xs ghost" data-finav="${a.id}">Terminar</button>` : ""}</div>`).join("")}</div>` : ""}
        </section>
      </div>
      <p class="status" id="cxmsg"></p>
      <div class="row"><span class="sp"></span>${modo !== "local" ? `<button class="btn ghost" data-cx="sinc">Sincronizar ahora</button>` : ""}<button class="btn" data-cx="cerrar">Listo</button></div></div>`;
    $$("[data-cx]", dl).forEach(b => b.onclick = async () => {
      const a = b.dataset.cx, msg = $("#cxmsg", dl);
      if (a === "cerrar") { dl.close(); dl.remove(); return; }
      try {
        if (a === "sinc" || a === "recargar") { msg.textContent = "Sincronizando…"; await D.sincronizar(); msg.textContent = "Listo."; }
        if (a === "enviar") { ls.set("cifrados-red-base", base()); msg.textContent = "Enviando…"; const r = await D.enviarARed(base()); msg.textContent = `Listo: ${r.cargados} registros en la red. Ya pueden entrar los demás.`; }
        if (a === "traer") { ls.set("cifrados-red-base", base()); msg.textContent = "Trayendo…"; const n = await D.traerDeRed(base()); msg.textContent = n ? `${n} cambio(s) de la red; se están subiendo a la nube.` : "No hay cambios nuevos en la red."; }
        if (a === "avisar") { ls.set("cifrados-red-base", base()); msg.textContent = "Leyendo los datos del servidor…"; const ok = await avisarATodos(base()); msg.textContent = ok ? "Aviso enviado: a todos les aparece una ventana con los datos para conectarse." : ""; pinta(); }
      } catch (er) { msg.textContent = /fetch|Failed|NetworkError|Load failed/i.test(er.message) ? "No encuentro el servidor de red en esa dirección. ¿Está corriendo «node red/servidor.js» en esta compu?" : er.message; }

  const pintaYEnlaza = pinta;

// ================= AVISOS DE RED =================
// Quien dirige prende la red y con «📣 Avisar a todos» manda dirección, PIN y Wi-Fi; a cada integrante le sale una ventana.
const anunciosRed = () => D.lista("cif_anuncios").filter(a => a.tipo === "red" && a.activo && (!a.vence || a.vence > new Date().toISOString())
  && (!a.ministerio_id || esSuper() || membresias().some(m => m.ministerio_id === a.ministerio_id)))
  .sort((a, b) => (b.actualizado || "").localeCompare(a.actualizado || ""));
const puedeAvisar = minId => D.modo === "nube" && (esSuper() || (minId ? rolEn(minId) === "admin" : membresias().some(m => m.rol === "admin")));
const vistoAnuncio = a => ls.get("cifrados-aviso-visto", {})[a.id] === a.actualizado;
function revisarAnuncios() {
  if (D.modo !== "nube" || st.editando || document.querySelector("dialog[open]")) return;
  const a = anunciosRed().find(x => !vistoAnuncio(x) && x.creado_por !== (yo() || {}).id);
  if (a) mostrarAnuncioRed(a);
}
function mostrarAnuncioRed(a, forzar) {
  if (!a) return;
  const d = a.datos || {}, urls = d.urls || [], url = urls[0] || "", min = a.ministerio_id ? nombreMin(a.ministerio_id) : "todos los ministerios";
  const todo = [`Red local de ${min} (Cifrados)`, d.wifi ? `Wi-Fi: ${d.wifi}` : "", `Dirección: ${url}`, ...urls.slice(1).map(u => `Otra dirección: ${u}`), `PIN: ${d.pin}`, d.nota ? `Nota: ${d.nota}` : ""].filter(Boolean).join("\n");
  const dl = document.createElement("dialog");
  dl.innerHTML = `<div class="dlg avisored"><h2>📡 Red local activa</h2>
    <p>${esc(nombreDe(a.creado_por))} prendió la red de <b>${esc(min)}</b>. Para ver el set y seguir a quien dirige, aunque no haya internet:</p>
    <ol class="avpasos">
      <li>${d.wifi ? `Conéctate al Wi-Fi <b>«${esc(d.wifi)}»</b>.` : "Conéctate a la misma red Wi-Fi que quien dirige."}</li>
      <li>Abre esta dirección en tu navegador:<div class="avdato"><code>${esc(url)}</code><button class="btn xs" data-copia="${esc(url)}">Copiar</button></div>
        ${urls.length > 1 ? `<small class="status">Si no abre, prueba: ${urls.slice(1).map(esc).join(" · ")}</small>` : ""}</li>
      <li>Escribe el PIN:<div class="avdato"><code class="pin">${esc(d.pin || "")}</code><button class="btn xs" data-copia="${esc(d.pin || "")}">Copiar</button></div></li>
    </ol>
    ${d.nota ? `<p class="avnota">${esc(d.nota)}</p>` : ""}
    <div class="row"><button class="btn ghost" data-copia="${esc(todo)}">Copiar todo</button><span class="sp"></span><button class="btn ghost" data-cerrar>Cerrar</button><a class="btn" href="${esc(url)}" target="_blank" rel="noopener">Abrir la red</a></div>
    <p class="status" style="font-size:12px">Lo vuelves a ver en Conexión (abajo a la izquierda). ${a.vence ? "Se quita solo el " + new Date(a.vence).toLocaleString("es-MX", { weekday: "long", hour: "2-digit", minute: "2-digit" }).replace(/\.$/, "") : ""}</p></div>`;
  document.body.appendChild(dl);
  const marcar = () => { const v = ls.get("cifrados-aviso-visto", {}); v[a.id] = a.actualizado; ls.set("cifrados-aviso-visto", v); };
  $$("[data-copia]", dl).forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copia); toast("Copiado."); } catch (e) { toast("No se pudo copiar; selecciónalo y cópialo a mano."); } });
  $("[data-cerrar]", dl).onclick = () => dl.close();
  dl.addEventListener("close", () => { marcar(); dl.remove(); });
  dl.showModal();
}
/** Lee del servidor (en esta compu) dirección, PIN y Wi-Fi y manda el aviso al ministerio elegido. */
async function avisarATodos(base) {
  const info = await fetch(base + "/api/info").then(r => r.json());
  if (!info || info.app !== "cifrados-red") throw new Error("Eso no parece el servidor de red de Cifrados.");
  const mins = esSuper() ? D.lista("cif_ministerios") : misMins().filter(m => rolEn(m.id) === "admin");
  const d = await dialogo(`<h2>📣 Avisar a todos</h2><p>Les aparece una ventana con estos datos para conectarse.</p>
    <label class="lb">¿A quién?<select class="field" name="min">${esSuper() ? `<option value="">Todos los ministerios</option>` : ""}${mins.map(m => `<option value="${m.id}" ${minActual() && m.id === minActual().id ? "selected" : ""}>${esc(m.nombre)}</option>`).join("")}</select></label>
    <label class="lb">Wi-Fi <small>al que se deben conectar</small><input class="field" name="wifi" value="${esc(info.wifi || "")}" placeholder="Nombre de la red Wi-Fi"></label>
    <div class="avdato"><code>${esc((info.urls || [])[0] || "sin dirección: conecta esta compu a un Wi-Fi")}</code><span class="status">PIN <b>${esc(info.pin)}</b></span></div>
    <label class="lb">Nota <small>opcional</small><input class="field" name="nota" placeholder="Ensayo 6 pm · trae tu tablet cargada"></label>
    <label class="lb">Se quita solo en<select class="field" name="horas"><option value="3">3 horas</option><option value="6" selected>6 horas</option><option value="12">12 horas</option><option value="24">1 día</option></select></label>`, "Enviar aviso");
  if (!d) return false;
  if (!(info.urls || []).length) throw new Error("El servidor no tiene dirección de red: conecta esta compu a un Wi-Fi o router.");
  // un solo aviso activo por ministerio: se terminan los anteriores
  for (const a of anunciosRed().filter(x => (x.ministerio_id || "") === (d.min || ""))) await D.guardar("cif_anuncios", { ...a, activo: false });
  await D.guardar("cif_anuncios", { tipo: "red", ministerio_id: d.min || null, activo: true, creado_por: yo().id,
    vence: new Date(Date.now() + (+d.horas || 6) * 3600e3).toISOString(),
    datos: { urls: info.urls, pin: info.pin, wifi: d.wifi || info.wifi || null, equipo: info.equipo, nota: d.nota || null } });
  return true;
}

function vLogin() {
  return `<div class="login"><form class="card" id="flog"><img src="icono-512.png" width="56" height="56" alt="" style="border-radius:12px;background:#1B1C1A"><h1>Cifrados</h1><p>Tiempo de Dios · la librería de canciones de todos los ministerios.</p>
