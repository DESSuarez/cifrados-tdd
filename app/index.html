<html lang="es">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex, nofollow">
<title>Cifrados Tiempo de Dios</title>
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B1C1A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>/* La liga de invitación / recuperación llega en el hash; se guarda antes de que Supabase lo limpie */
window.HASH0 = location.hash;
/* Tema y menú guardados por navegador (mismo esquema que la Bitácora) */
try{var t=localStorage.getItem("cifrados-tema");if(t==="dia")document.documentElement.dataset.theme="light";else if(t==="noche")document.documentElement.dataset.theme="dark";else if(t==="retro")document.documentElement.dataset.theme="retro";
if(localStorage.getItem("cifrados-lateral")==="oculta")document.documentElement.dataset.lateral="oculta"}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Tokens idénticos a la Bitácora TDD: Night, Flame (Música), Baby blue, Deep sea green, Sol, Lavanda, Rosa */
:root{
  --night:#1B1C1A; --flame:#FF3D1A; --baby:#98D5E0; --sea:#457A7F; --sol:#F2B33D;
  --bg:#FFFFFF; --surface:#F4F7F7; --fg:#1B1C1A; --muted:#5E6766; --line:#DDE5E5;
  --sea-text:#3A6A6F; --baby-ink:#2B7B8A; --baby-soft:#E3F3F6; --flame-soft:#FFE7E1; --sea-soft:#E2EEEF;
  --sol-ink:#8A5A00; --sol-soft:#FDF1D8;
  --lav:#7E5BD0; --lav-ink:#5E3FAE; --lav-soft:#EEE8FA; --rosa:#D9558E; --rosa-ink:#B23A70; --rosa-soft:#FBE6EF;
  --band:#1B1C1A;
  --area:var(--flame); --area-ink:var(--flame); --area-soft:var(--flame-soft); --on-area:#FFFFFF;
  --display:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;
  --body:"Archivo","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --acorde:var(--flame); --tam:20px; --inter:1.35;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1C1A; --surface:#242623; --fg:#F5F7F6; --muted:#A3ADAC; --line:#353835;
  --sea-text:#8CC3C8; --baby-ink:#98D5E0; --baby-soft:#203033; --flame-soft:#3A2019; --sea-soft:#1F3133; --sol-ink:#F2B33D; --sol-soft:#352B17; --band:#121311; --lav:#9A7BE6; --lav-ink:#B9A3EE; --lav-soft:#2A2440; --rosa:#E06A9C; --rosa-ink:#F08BB7; --rosa-soft:#3A1F2B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1C1A; --surface:#242623; --fg:#F5F7F6; --muted:#A3ADAC; --line:#353835;
  --sea-text:#8CC3C8; --baby-ink:#98D5E0; --baby-soft:#203033; --flame-soft:#3A2019; --sea-soft:#1F3133; --sol-ink:#F2B33D; --sol-soft:#352B17; --band:#121311; --lav:#9A7BE6; --lav-ink:#B9A3EE; --lav-soft:#2A2440; --rosa:#E06A9C; --rosa-ink:#F08BB7; --rosa-soft:#3A1F2B; color-scheme:dark}
:root[data-theme="retro"]{
  --night:#0B0221; --flame:#FF2E88; --baby:#00E5FF; --sea:#2BFF88; --sol:#FFE600;
  --bg:#0B0221; --surface:#170A3A; --fg:#F4ECFF; --muted:#B9A6E8; --line:#3A2373;
  --sea-text:#2BFF88; --baby-ink:#00E5FF; --baby-soft:#06283B; --flame-soft:#3A0A2A; --sea-soft:#08301F;
  --sol-ink:#FFE600; --sol-soft:#3A3305; --band:#05010F;
  --lav:#B266FF; --lav-ink:#C99BFF; --lav-soft:#24104A; --rosa:#FF6EC7; --rosa-ink:#FF9AD8; --rosa-soft:#3A0A2E; color-scheme:dark}
:root[data-theme="retro"] body{background:radial-gradient(1200px 600px at 70% -10%,#2A0B5A 0%,transparent 60%),var(--bg)}
:root[data-theme="retro"] .band{background:linear-gradient(180deg,#05010F 0%,#1A0640 70%,#3A0A5C 100%)}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--area-ink)}
:focus-visible{outline:3px solid var(--baby);outline-offset:2px;border-radius:6px}

/* ---------- Menú lateral (igual que la Bitácora) ---------- */
.shell{display:flex;min-height:100vh}
.maincol{flex:1;min-width:0}
.side{width:264px;flex:none;position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:6px;background:var(--surface);border-right:1px solid var(--line);padding:24px 12px 20px;z-index:40}
.sidetop{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 6px 10px}
.sbrand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);min-width:0}
.sbrand img{border-radius:9px;background:#1B1C1A;padding:4px;flex:none}
.sbrand b{display:block;font-family:var(--display);font-weight:900;font-size:16px;line-height:1.1}
.sbrand small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.sideclose,.hamb{display:none;width:40px;height:40px;border-radius:10px;border:0;background:transparent;place-items:center;padding:0;color:inherit}
.sideclose svg,.hamb svg{width:22px;height:22px}
.areanav{display:flex;flex-direction:column;gap:2px;flex:1;min-height:0;overflow-y:auto;margin:0 -6px;padding:0 6px;scrollbar-width:thin}
.sidesec{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:16px 10px 6px}
.areanav a{position:relative;display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;color:var(--fg);text-decoration:none;font-weight:700;font-size:14.5px}
.areanav a:hover{background:color-mix(in srgb,var(--fg) 7%,transparent)}
.areanav a[aria-current="page"]{background:color-mix(in srgb,var(--c) 20%,transparent)}
.areanav a[aria-current="page"]::before{content:"";position:absolute;left:-6px;top:9px;bottom:9px;width:4px;border-radius:4px;background:var(--c)}
.areanav .ic{width:30px;height:30px;flex:none;border-radius:9px;background:var(--c);color:var(--on,#fff);display:grid;place-items:center}
.areanav .ic svg{width:16px;height:16px}
.areanav .lb{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.areanav .cnt{font-family:var(--mono);font-size:11.5px;font-weight:500;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.areanav .cnt:empty{display:none}
.minsel{margin:0 4px 4px;height:40px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);padding:0 10px;font-weight:700;width:calc(100% - 8px)}
.sync{display:flex;align-items:center;gap:8px;font:500 12px var(--mono);color:var(--muted);padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line);cursor:pointer;text-align:left}
.sync i{width:9px;height:9px;border-radius:50%;flex:none;background:#1DB954}
.sync.pend i{background:var(--sol)}.sync.off i{background:var(--muted)}.sync.local i{background:var(--baby-ink)}.sync.err i{background:var(--flame)}
.sync.red i{background:var(--lav);box-shadow:0 0 0 3px color-mix(in srgb,var(--lav) 30%,transparent)}
.sync:hover{border-color:var(--flame)}
.cxmodos{display:grid;gap:10px}
.cxm{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.cxm.act{border-color:var(--flame);background:color-mix(in srgb,var(--flame) 7%,transparent)}
.cxm>b{font-family:var(--display);font-weight:800;font-size:15px}
.cxm p{margin:0;font-size:13.5px;color:var(--muted)}.cxm p b{color:var(--fg)}
.cxm code{font-family:var(--mono);font-size:12px;background:var(--surface);padding:1px 5px;border-radius:5px}
.cxavisos{display:grid;gap:6px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13.5px}
.avisored h2{color:var(--fg)}
.avpasos{margin:0;padding-left:22px;display:grid;gap:12px;font-size:15px}
.avdato{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px;padding:10px 12px;border:1.5px dashed var(--line);border-radius:12px;background:var(--surface)}
.avdato code{flex:1;min-width:0;font:500 16px var(--mono);word-break:break-all}
.avdato code.pin{font-size:26px;letter-spacing:.3em}
.avnota{padding:10px 12px;border-radius:10px;background:var(--sol-soft);color:var(--fg)!important}
.cmdred{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cmdred input{flex:1;min-width:240px;font-family:var(--mono)!important;font-size:13.5px!important}
/* tarjeta de cuenta a todo lo ancho; abajo Apariencia y Salir */
.userbar{position:relative;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.ubtns{display:flex;gap:6px}
.ubtn{flex:1;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:13px;padding:0 10px}
.ubtn:hover{border-color:var(--flame)}
.ubtn svg{width:16px;height:16px;flex:none}
.temamenu{position:absolute;left:0;right:0;bottom:calc(100% + 6px);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:2px;z-index:60}
.temamenu button{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--fg);padding:9px 10px;border-radius:9px;font-weight:700;font-size:14px;text-align:left}
.temamenu button:hover{background:var(--surface)}
.temamenu button span{width:22px;text-align:center}
.temamenu button b{margin-left:auto;color:var(--flame)}
.acct{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:62px;padding:11px 14px 11px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);text-align:left;text-decoration:none}
.acct:hover{border-color:var(--flame)}
.acct .av{width:38px;height:38px;font-size:14px}
.acct>span:not(.av){gap:2px}
.av{width:32px;height:32px;border-radius:50%;background:var(--flame);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
img.av{object-fit:cover;background:var(--surface)}
/* Perfil: foto, descripción y favoritas */
.fotoedit{display:flex;flex-direction:column;align-items:center;gap:6px}
.fotobtn{position:relative;cursor:pointer;border-radius:50%}
.fotobtn>span:last-of-type:not(.av){position:absolute;right:-2px;bottom:-2px;width:30px;height:30px;border-radius:50%;background:var(--bg);border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px}
.fotobtn:hover .av{filter:brightness(.92)}
/* Carta de presentación (como el perfil de la Bitácora) */
.pcarta{border:1.5px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
.pcover{height:170px;position:relative;background-size:cover;background-repeat:no-repeat}
.pcover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.18));pointer-events:none}
.pcover.conimg::after{background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 45%,rgba(0,0,0,.25))}
.pcover.ajustando{cursor:grab;touch-action:none;box-shadow:inset 0 0 0 3px var(--baby)}
.pcover.ajustando:active{cursor:grabbing}
.pcoveracts{position:absolute;left:16px;top:14px;z-index:3;display:flex;gap:6px;flex-wrap:wrap}
.pcoverbtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:99px;border:0;background:rgba(27,28,26,.55);color:#fff;font:700 13px var(--body);cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pcoverbtn:hover{background:rgba(27,28,26,.8)}
.pcoverbtn.ok{background:#fff;color:#1B1C1A}
.pcoverhint{display:inline-flex;align-items:center;height:32px;padding:0 12px;border-radius:99px;background:rgba(27,28,26,.55);color:#fff;font-size:13px;font-weight:700}
.pmarca{position:absolute;right:20px;top:16px;z-index:1;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85)}
.pcarta .pbody{display:flex;align-items:flex-end;gap:26px;padding:0 28px;margin-top:-84px;position:relative;z-index:2;flex-wrap:wrap}
.pfoto{position:relative;flex:none}
.av.xxl{width:176px;height:176px;font-size:64px;border:6px solid var(--surface);box-shadow:0 10px 30px rgba(0,0,0,.22);box-sizing:content-box}
.pfotobtn{position:absolute;right:8px;bottom:10px;width:44px;height:44px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;cursor:pointer;border:3px solid var(--surface);box-shadow:0 4px 12px rgba(0,0,0,.2);font-size:18px}
.pfotobtn:hover{background:var(--flame);color:#fff}
.pcarta .pinfo{display:flex;flex-direction:column;gap:6px;min-width:240px;flex:1;padding:96px 0 4px}
.pcarta .pinfo h2{margin:0;font:900 34px var(--display);font-stretch:108%;line-height:1.1}
.pcarta .u{font-family:var(--mono);font-size:14px;color:var(--muted)}
.pcarta .prol{font-weight:800;font-size:15px}
.pchips{display:flex;flex-wrap:wrap;gap:6px}
.pchips .chip{text-decoration:none;font-weight:800}
.pcarta .mail{font-family:var(--mono);font-size:13px;color:var(--muted)}
.pcarta .pbio{padding:22px 28px 4px}
.pcarta .pbio h3{margin:0 0 6px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.pcarta .pbio p{margin:0;font-size:16px;line-height:1.6;white-space:pre-wrap;max-width:68ch}
.pcarta .pbio p.vacio{color:var(--muted);font-size:14px}
.pcarta .pacts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 28px 0}
.pcarta>:last-child{padding-bottom:24px}
.pcarta .favs{display:flex;flex-direction:column;gap:6px;width:100%}
@media (max-width:640px){
  .pcover{height:120px}
  .pcoverbtn span{display:none}.pcoverbtn{padding:0 10px}
  .pmarca{display:none}
  .pcarta .pbody{flex-direction:column;align-items:center;text-align:center;margin-top:-80px;gap:12px;padding:0 18px}
  .pcarta .pinfo{padding:0;align-items:center;min-width:0;width:100%}
  .pcarta .pinfo h2{font-size:28px}
  .pchips{justify-content:center}
  .av.xxl{width:148px;height:148px;font-size:54px}
  .pcarta .pbio,.pcarta .pacts{padding-left:18px;padding-right:18px}
}
.bio{margin:0;font-size:15.5px;line-height:1.55;white-space:pre-wrap}
.favs{display:flex;flex-direction:column;gap:6px}.favs>b{font-size:13px}
.chip.fav{background:var(--rosa-soft);color:var(--rosa-ink);border-color:transparent;text-decoration:none;height:28px;padding:0 12px;font-size:12.5px}
.chip.fav:hover{filter:brightness(.96)}
.chip.minrol{gap:4px;padding-right:4px}
.chip.minrol select{border:0;background:transparent;font:inherit;color:var(--fg);cursor:pointer;padding:0 2px}
/* Exportar PDF */
.pdfcols{align-self:flex-start;height:auto}
.pdfcols label{display:flex;cursor:pointer}
.pdfcols input{position:absolute;opacity:0;pointer-events:none}
.pdfcols span{padding:9px 14px;font-weight:700;font-size:13.5px}
.pdfcols label+label span{border-left:1.5px solid var(--line)}
.pdfcols input:checked+span{background:var(--area);color:var(--on-area)}
.pdfcols input:focus-visible+span{outline:3px solid var(--baby)}
.pdffiltro summary{cursor:pointer;font-weight:700}
.pdffiltro{border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px}
.pdfchk{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:4px 10px;max-height:180px;overflow:auto;margin:6px 0 10px}
.pdfchk label{display:flex;gap:6px;align-items:center;font-size:13.5px}
/* Perfil del ministerio: muestra del PDF */
.pdfmuestra{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;color:#1B1C1A;max-width:560px}
.pmband{background:var(--o);border-bottom:4px solid var(--p);padding:16px 18px;display:flex;gap:12px;align-items:center}
.pmband img{width:38px;height:38px;object-fit:cover;border-radius:50%;flex:none}
.recorte{display:grid;place-items:center}
.recorte canvas{width:240px;height:240px;border-radius:14px;touch-action:none;cursor:grab;background:repeating-conic-gradient(#C9D2D1 0 25%,#fff 0 50%) 0 0/16px 16px}
.recorte canvas.mov{cursor:grabbing}
.mctl input[type=range]{flex:1;min-width:0;accent-color:var(--flame)}
.pmdots{display:flex;gap:4px}.pmdots i{width:8px;height:8px;border-radius:50%;background:var(--p)}.pmdots i:nth-child(2){background:var(--s)}.pmdots i:nth-child(3){background:#8a9493}
.pmband small{display:block;font:500 10px var(--mono);letter-spacing:.08em;color:#C9D2D1}
.pmband b{display:block;font:800 20px var(--body);color:#fff}
.pmband em{font-style:normal;font-size:12px;color:var(--s)}
.pmcuerpo{padding:14px 18px;display:grid;gap:6px}
.pmsec{display:block;background:#457A7F;color:#fff;font:800 10px var(--body);letter-spacing:.06em;padding:4px 8px;border-radius:5px}
.pmlin{display:flex;font-size:14px}.pmlin span{display:inline-flex;flex-direction:column;white-space:pre}.pmlin i{font-style:normal;font-weight:800;color:var(--p);font-size:12.5px;min-height:1.1em}
.marcagrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.mcampo{display:flex;flex-direction:column;min-width:0}
.mcampo>b{font-weight:800;font-size:14px;line-height:1.3}
.mcampo>small{font-size:12.5px;font-weight:500;color:var(--muted);line-height:1.3;margin:2px 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mctl{display:flex;align-items:center;gap:10px;height:48px;border:1.5px solid var(--line);border-radius:10px;padding:0 8px 0 10px;background:var(--bg);min-width:0}
.mctl input[type=color]{width:30px;height:30px;border:0;background:none;padding:0;cursor:pointer;flex:none}
.mctl code{font:500 13px var(--mono);text-transform:uppercase}
.mctl .sp{flex:1}
.mlogo{width:34px;height:34px;object-fit:cover;border-radius:50%;flex:none}
.mlogo.vacio{width:auto;border-radius:0;display:flex;align-items:center;font:500 12px var(--mono);color:var(--muted)}
.mdesc{height:auto;padding:12px 14px;resize:vertical;line-height:1.45}
.acct>span:not(.av){flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.acct b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.acct small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.temabtn{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center;padding:0}
.temabtn svg{width:20px;height:20px}
.mtop{display:none;align-items:center;gap:6px;margin:-8px 0 -4px -8px}
@media (max-width:900px){
  .side{position:fixed;left:0;top:0;bottom:0;width:min(296px,86vw);transform:translateX(-104%);transition:transform .22s ease;box-shadow:0 0 48px rgba(0,0,0,.35);visibility:hidden}
  body.menu-abierto .side{transform:none;visibility:visible}
  .sideback{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35}
  .sideclose,.hamb{display:grid}
  .mtop{display:flex}
  body.menu-abierto{overflow:hidden}
}
.sidetoggle{width:34px;height:34px;flex:none;border-radius:9px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;padding:0}
.sidetoggle svg{width:19px;height:19px}.sidetoggle:hover{background:var(--bg);color:var(--fg)}
.sideborde{display:none}
@media (min-width:901px){
  :root{--suave:cubic-bezier(.22,.8,.24,1)}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;border:1px solid transparent;border-right-color:var(--line);transition:transform .38s var(--suave),left .38s var(--suave),top .38s var(--suave),bottom .38s var(--suave),border-radius .38s var(--suave),box-shadow .38s var(--suave)}

/* ---------- Constructor ---------- */

/* ---------- Señas ---------- */
.senas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.sena{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.escena{position:relative;aspect-ratio:4/3;background:var(--band);display:grid;place-items:center;overflow:hidden;border-bottom:6px solid var(--sc)}
.escena .mano{font-size:76px;line-height:1;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35))}
.escena .let{position:absolute;left:12px;top:10px;font:900 26px var(--display);color:var(--sc);font-stretch:112%}
.escena .foto{position:absolute;inset:0;background-repeat:no-repeat}

.m-pulso .mano,.m-pulso .foto{animation:pulso 1.4s ease-in-out infinite}
.m-subir .mano,.m-subir .foto{animation:subir 2s ease-in-out infinite}
.m-bajar .mano,.m-bajar .foto{animation:bajar 2s ease-in-out infinite}
.m-girar .mano{animation:girar 1.6s linear infinite}.m-girar .foto{animation:girarf 1.6s linear infinite}
.m-arco .mano,.m-arco .foto{animation:arco 2.2s ease-in-out infinite}
.m-cortar .mano,.m-cortar .foto{animation:cortar 1.6s ease-in infinite}
.m-toque .mano,.m-toque .foto{animation:toque 1.2s ease-in-out infinite}
.m-lado .mano,.m-lado .foto{animation:lado .8s ease-in-out infinite alternate}
.m-contar .mano{animation:pulso .9s ease-in-out infinite}
.m-quieto .mano,.m-quieto .foto{animation:quieto 3s ease-in-out infinite}
@keyframes pulso{0%,100%{transform:scale(1)}20%{transform:scale(1.15)}40%{transform:scale(1)}60%{transform:scale(1.15)}}
@keyframes subir{0%{transform:translateY(40px) rotate(-8deg);opacity:.4}70%{transform:translateY(-30px) rotate(0);opacity:1}100%{transform:translateY(-30px);opacity:0}}
@keyframes bajar{0%{transform:translateY(-36px);opacity:.4}70%{transform:translateY(30px);opacity:1}100%{transform:translateY(30px);opacity:0}}
@keyframes girar{from{transform:rotate(0) translateX(18px) rotate(0)}to{transform:rotate(360deg) translateX(18px) rotate(-360deg)}}
@keyframes girarf{from{transform:rotate(0) translateX(3%) rotate(0) scale(1.08)}to{transform:rotate(360deg) translateX(3%) rotate(-360deg) scale(1.08)}}
@keyframes arco{0%{transform:translate(-60px,20px) rotate(-20deg)}50%{transform:translate(0,-26px) rotate(0)}100%{transform:translate(60px,20px) rotate(20deg)}}
@keyframes cortar{0%,40%{transform:scale(1.1)}55%{transform:scale(.7)}60%,100%{transform:scale(.8);opacity:.6}}
@keyframes toque{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px)}55%{transform:translateY(-14px)}}
@keyframes lado{from{transform:translateX(-26px) rotate(-6deg)}to{transform:translateX(26px) rotate(6deg)}}
@keyframes quieto{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}

/** Recorta al centro y comprime la foto a 360×360 JPEG (≈30 KB) para guardarla dentro del perfil (se ve grande en la carta). */
function fotoChica(archivo) {
  return new Promise((ok, mal) => {
    const img = new Image(), url = URL.createObjectURL(archivo);
    img.onload = () => {
      const lado = Math.min(img.width, img.height), c = document.createElement("canvas"); c.width = c.height = 360;
      c.getContext("2d").drawImage(img, (img.width - lado) / 2, (img.height - lado) / 2, lado, lado, 0, 0, 360, 360);
      URL.revokeObjectURL(url); ok(c.toDataURL("image/jpeg", 0.82));
    };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error("No pude leer esa imagen.")); };
    img.src = url;
  });
}
/** Portada del perfil: JPEG de máx. 1200 px de ancho (≈150 KB). La posición vertical va al final como «#y=0…100». */
function portadaChica(archivo) {
  return new Promise((ok, mal) => {
    const img = new Image(), url = URL.createObjectURL(archivo);
    img.onload = () => {
      const k = Math.min(1, 1200 / img.width), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      let q = 0.78, d = c.toDataURL("image/jpeg", q);
      while (d.length > 560000 && q > 0.4) d = c.toDataURL("image/jpeg", (q -= 0.08));
      ok(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); mal(new Error("No pude leer esa imagen.")); };
    img.src = url;
  });
}
const portadaSrc = v => (v ? String(v).split("#")[0] : null);
const portadaY = v => { const x = /#y=(\d+)/.exec(v || ""); return x ? Math.min(100, +x[1]) : 50; };
/** Texto blanco u oscuro según el color de fondo (para los chips de ministerio). */

function cartaPerfil(p, op = {}) {

  };

const esSuper = () => D.modo === "local" || !!(miPerfil() && miPerfil().superadmin);

function rolEn(minId) { if (esSuper()) return "admin"; const m = yo() && D.uno("cif_miembros", minId + "|" + yo().id); return m ? m.rol : null; }
const esMusico = () => esSuper() || membresias().some(m => m.rol !== "lector");
// Sets compartidos (migración 012): el ministerio dueño invita a otros (s.invitados) y todos lo ven y editan en tiempo real.
const setEnMin = (s, minId) => s.ministerio_id === minId || (s.invitados || []).includes(minId);

// Quién ve una canción (igual que cif_min_ve en SQL, migración 009):

  return esLiturgica(c) && esColectivo(x);
}
const veCancion = c => {
  if (!hayColectivo()) return D.modo === "local" || (c.visibilidad || "todos") === "todos" || esSuper() || (yo() && c.creada_por === yo().id)
    || membresias().some(m => m.ministerio_id === c.ministerio_id || (c.compartida_con || []).includes(m.ministerio_id));

const nombreMin = id => (D.uno("cif_ministerios", id) || {}).nombre || "otro ministerio";

const comparteCancion = c => esSuper() || (yo() && c.creada_por === yo().id) || ["admin", "musico"].includes(rolEn(c.ministerio_id));
/** Etiqueta corta de privacidad para listas */
function chipPrivacidad(c) {

    b.classList.add("red"); t.textContent = `Red local · ${e.conectados || 1} conectado${(e.conectados || 1) === 1 ? "" : "s"}`; return;
  }
  if (!e.nube) { b.classList.add("local"); t.textContent = "Modo local · este dispositivo"; return; }
  if (!e.enLinea) { b.classList.add("off"); t.textContent = `Sin conexión · ${e.pendientes ? e.pendientes + " por subir" : "todo guardado aquí"}`; return; }
  if (e.error) { b.classList.add("err"); t.textContent = e.error; return; }
  if (e.sincronizando || e.pendientes) { b.classList.add("pend"); t.textContent = e.pendientes ? `Subiendo ${e.pendientes} cambio${e.pendientes > 1 ? "s" : ""}…` : "Sincronizando…"; return; }
  t.textContent = "En tiempo real · al día";
}
D.alEstado(pintarSync);

// ================= LIBRERÍA =================
// Tres pestañas: Tiempo de Dios (primero), el resto y litúrgicas. Filtros por artista, tono y etiquetas.
const grupoDe = c => (esLiturgica(c) ? "liturgicas" : esTDD(c) ? "tdd" : "otras");
function vLibreria() {
  const todas = canciones();
  const n = { tdd: 0, otras: 0, liturgicas: 0 }; todas.forEach(c => n[grupoDe(c)]++);
  const enTab = todas.filter(c => grupoDe(c) === st.tab);
  const conMio = new Set(yo() ? D.lista("cif_tonos").filter(t => t.persona_id === yo().id).map(t => t.cancion_id) : []);
  const conPista = new Set(D.lista("cif_tracks").map(t => t.cancion_id));
  const autores = [...new Set(enTab.flatMap(artistasDe))].sort((a, b) => a.localeCompare(b, "es"));
  const tonosUsados = C.TONOS.filter(t => enTab.some(c => c.tono === t));
  const tags = [...new Set(todas.flatMap(c => c.etiquetas || []))].sort((a, b) => a.localeCompare(b, "es"));
  const q = norm(st.q);
  let lista = enTab.filter(c => !q || norm(c.titulo + " " + c.autor + " " + (c.etiquetas || []).join(" ")).includes(q) || (q.length > 3 && norm(c.contenido.replace(/\[[^\]]*\]/g, "")).includes(q)));
  if (st.fArtista) lista = lista.filter(c => artistasDe(c).includes(st.fArtista));
  if (st.fTono) lista = lista.filter(c => c.tono === st.fTono);
  if (st.fTags.length) lista = lista.filter(c => (c.etiquetas || []).some(t => st.fTags.includes(t)));
  if (st.fMio) lista = lista.filter(c => conMio.has(c.id));
  if (st.fPista) lista = lista.filter(c => conPista.has(c.id));
  if (st.fPriv) lista = lista.filter(esPrivada);
  const hayFiltro = st.fArtista || st.fTono || st.fTags.length || st.fMio || st.fPista || st.fPriv;
  const fila = c => {
    const mt = miTono(c.id);
    return `<li><a class="srow" href="#cancion/${c.id}"><div><b>${esc(c.titulo)}</b><small>${artistasHTML(c, false) || "—"}${(c.etiquetas || []).length ? `<span class="etq"> · ${esc(c.etiquetas.join(", "))}</span>` : ""}</small></div><span class="chips">
      ${chipPrivacidad(c)}${c.tono ? `<span class="chip tono">${esc(c.tono)}</span>` : ""}${mt ? `<span class="chip mio" title="Tu tono">★ ${esc(mt.tono)}</span>` : ""}${conPista.has(c.id) ? `<span class="chip pista">♫ pista</span>` : ""}${c.bpm ? `<span class="chip tono">${c.bpm} bpm</span>` : ""}</span></a></li>`;
  };
  let filas = "";
  if (st.tab === "liturgicas" && !q) {
    // agrupadas por momento de la misa
    const grupos = new Map(MOMENTOS.map(([k]) => [k, []])); grupos.set(null, []);
    lista.forEach(c => grupos.get(momentoDe(c)).push(c));
    grupos.forEach((cs, k) => { if (cs.length) filas += `<li class="letra-h">${esc(k ? nombreMomento(k).toUpperCase() : "OTRAS")}</li>` + cs.map(fila).join(""); });
  } else {
    let letra = "";
    lista.forEach(c => {
      const l = (norm(c.titulo)[0] || "#").toUpperCase(), L = /[A-Z]/.test(l) ? l : "#";
      if (L !== letra && !q) { filas += `<li class="letra-h">${L}</li>`; letra = L; }
      filas += fila(c);
    });
  }
  const vacio = { tdd: ["Aún no hay canciones de Tiempo de Dios", "Aquí aparecen las canciones cuyo artista es Tiempo de Dios. Edita una canción y escribe «Tiempo de Dios» en Autor."],
    otras: ["Aún no hay canciones", "Importa tu exportación de SongbookPro (.sbp), archivos ChordPro o crea una con el constructor."],
    liturgicas: ["Aún no hay canciones litúrgicas", "Ponle la etiqueta «Litúrgica» a una canción (o un título que empiece con «Misa»)."] }[st.tab];
  const main = `
    ${D.nube && !esSuper() && !membresias().length ? `<a class="avisomin" href="#ministerios"><b>Aún no estás en un ministerio.</b> ${D.lista("cif_solicitudes").some(s => yo() && s.persona_id === yo().id && s.estado === "pendiente") ? "Tu solicitud está en revisión." : "Pide entrar al tuyo para ver sus sets →"}</a>` : ""}
    <div class="buscador"><input class="field" id="q" type="search" placeholder="Buscar por título, autor o letra…" value="${esc(st.q)}" autocomplete="off">
      ${esMusico() ? `<a class="btn" href="#nueva">${IC.mas} Nueva</a>${suscrito() ? `<button class="btn ghost" id="imp">Importar</button>` : ""}<button class="btn ghost" id="lpdf" title="Exportar a PDF las canciones de la lista o de los artistas que elijas">⎙ PDF</button>` : ""}</div>
    <div class="filtros">
      <select class="fsel ${st.fArtista ? "on" : ""}" id="fart" aria-label="Artista"><option value="">Todos los artistas</option>${autores.map(a => `<option ${a === st.fArtista ? "selected" : ""}>${esc(a)}</option>`).join("")}</select>
      <select class="fsel ${st.fTono ? "on" : ""}" id="fton" aria-label="Tono"><option value="">Cualquier tono</option>${tonosUsados.map(t => `<option ${t === st.fTono ? "selected" : ""}>${t}</option>`).join("")}</select>
      <button class="tchip ${st.fMio ? "on" : ""}" data-f="fMio">★ Con mi tono</button>
      <button class="tchip ${st.fPista ? "on" : ""}" data-f="fPista">♫ Con pista</button>
      ${D.nube ? `<button class="tchip ${st.fPriv ? "on" : ""}" data-f="fPriv" title="Canciones de tu ministerio que no están en toda la librería, y las que otros te compartieron">🔒 Privadas y compartidas</button>` : ""}
      ${tags.map(t => `<button class="tchip ${st.fTags.includes(t) ? "on" : ""}" data-tag="${esc(t)}" style="--c:var(--sea)">#${esc(t)}</button>`).join("")}
      ${hayFiltro ? `<button class="tchip" id="flimpia" style="--c:var(--muted)">✕ Quitar filtros</button>` : ""}
    </div>
    ${lista.length ? `<p class="status" style="margin:0">${lista.length} de ${enTab.length}</p><ul class="songs">${filas}</ul>`
      : enTab.length ? `<div class="empty"><strong>Nada con esos filtros</strong><p>Prueba con otra palabra o quita filtros.</p></div>`
      : `<div class="empty"><strong>${vacio[0]}</strong><p>${vacio[1]}</p>${st.tab !== "tdd" || !todas.length ? `<div class="row">${suscrito() && esMusico() ? `<button class="btn" id="imp2">Importar de SongbookPro</button>` : ""}${esMusico() ? `<a class="btn ghost" href="#nueva">Crear una</a>` : ""}</div>` : `<button class="btn ghost" data-ir-tab="otras">Ver las demás canciones (${n.otras})</button>`}</div>`}`;
  return {
    band: bandHTML({ titulo: "La <em>librería</em>", sub: `<span><b>${todas.length}</b> canciones</span><span>${!hayColectivo() ? "compartidas con todos los ministerios" : minActual() ? "librería de " + esc(minActual().nombre) + (esColectivo(minActual().id) ? " · con Tiempo de Dios y litúrgicas" : " · con Tiempo de Dios") : "todas"}</span><a class="bandlink" href="#banco">Buscar más en el banco →</a>`,
      tabs: tabsHTML([["tdd", "Tiempo de Dios", n.tdd], ["otras", "Otras canciones", n.otras], ["liturgicas", "Litúrgicas", n.liturgicas]], st.tab) }),
    main,
    after() {
      const qi = $("#q");
      qi.oninput = () => { st.q = qi.value; const pos = qi.selectionStart; render(); const nq = $("#q"); nq.focus(); nq.setSelectionRange(pos, pos); };
      const ponTab = t => { st.tab = t; ls.set("cifrados-tab", t); st.fArtista = ""; st.fTono = ""; render(); };
      $$("[data-tab]").forEach(b => b.onclick = () => ponTab(b.dataset.tab));
      $$("[data-ir-tab]").forEach(b => b.onclick = () => ponTab(b.dataset.irTab));
      $("#fart").onchange = e => { st.fArtista = e.target.value; e.target.blur(); render(); };
      $("#fton").onchange = e => { st.fTono = e.target.value; e.target.blur(); render(); };
      $$("[data-f]").forEach(b => b.onclick = () => { st[b.dataset.f] = !st[b.dataset.f]; render(); });
      $$("[data-tag]").forEach(b => b.onclick = () => { const t = b.dataset.tag; st.fTags = st.fTags.includes(t) ? st.fTags.filter(x => x !== t) : st.fTags.concat(t); render(); });
      const fl = $("#flimpia"); if (fl) fl.onclick = () => { st.fArtista = st.fTono = ""; st.fTags = []; st.fMio = st.fPista = st.fPriv = false; render(); };
      [$("#imp"), $("#imp2")].forEach(b => b && (b.onclick = abrirImportar));
      const lp = $("#lpdf"); if (lp) lp.onclick = () => abrirExportar({ items: lista.map(c => ({ c })), titulo: st.fArtista ? "Cancionero · " + st.fArtista : { tdd: "Cancionero · Tiempo de Dios", otras: "Cancionero", liturgicas: "Cancionero litúrgico" }[st.tab], multiple: true, filtros: true, tonoMio: true, minId: (minActual() || {}).id });
    },
  };
}

// ================= CANCIÓN =================
let ctxSet = null, vivo = null;
function vCancion(p) {
  const c = D.uno("cif_canciones", p[0]);
  if (!c || c.borrada) return { band: bandHTML({ titulo: "No encontré esa canción" }), main: `<a class="btn ghost" href="#libreria">← A la librería</a>` };
  // contexto de set: #cancion/<id>/set/<setId>/<i>
  ctxSet = null;
  if (p[1] === "set") {
    const s = D.uno("cif_sets", p[2]), i = +p[3] || 0;
    if (s) ctxSet = { s, i, item: s.items[i] };
  }
  const original = c.tono || C.adivinaTono(c.contenido) || "C";
  const mt = miTono(c.id);
  const tono = st.tonoVista[c.id] || (ctxSet && ctxSet.item && ctxSet.item.tono) || (mt && mt.tono) || original;
  const capo = st.capo[c.id] ?? (ctxSet ? (ctxSet.item && ctxSet.item.capo) || 0 : (mt && mt.capo) || 0);
  const semis = C.distancia(original, tono) - capo;
  const forma = C.transportaTono(tono, -capo);
  const e = st.estilo;
  // en un set, la estructura en bloques del set manda sobre la de la canción
  const orden = ctxSet && ctxSet.item && ctxSet.item.estructura && ctxSet.item.estructura.length ? ctxSet.item.estructura : c.orden;
  const html = e.sinAcordes ? C.aHTML(c.contenido, { soloLetra: true, orden }) : C.aHTML(c.contenido, { semis, tonoFinal: forma, orden, ...opNotacion() });
  const secs = orden && orden.length ? orden : [...new Set(C.secciones(c.contenido))];
  const tracks = tracksDe(c.id);

  // Tonos: primero los de mi ministerio, mis amigos y yo; el resto en "Otros"
  const cercanos = new Set([yo() && yo().id, ...amigos(), ...(minActual() ? personasMin(minActual().id).map(x => x.id) : [])]);
  const tonos = tonosDe(c.id).sort((a, b) => nombreDe(a.persona_id).localeCompare(nombreDe(b.persona_id)));
  const tonosCerca = tonos.filter(t => cercanos.has(t.persona_id)), tonosLejos = tonos.filter(t => !cercanos.has(t.persona_id));
  const chipTono = t => `<button class="tchip ${t.tono === tono && (t.capo || 0) === capo ? "on" : ""}" data-tono="${esc(t.tono)}" data-capo="${t.capo || 0}" title="Ver en el tono de ${esc(nombreDe(t.persona_id))}">${yo() && t.persona_id === yo().id ? "★ Yo" : esc(nombreDe(t.persona_id))} <small>${esc(t.tono)}${t.capo ? " c" + t.capo : ""}</small></button>`;
  const esMio = mt && mt.tono === tono && (mt.capo || 0) === capo;
  const puedeOtros = genteAsignable().filter(p => !yo() || p.id !== yo().id).length > 0;

  let setbar = "";
  if (ctxSet) {
    const n = ctxSet.s.items.length, it = ctxSet.item || {};
    setbar = `<div class="setbar"><a class="navbtn" href="#set/${ctxSet.s.id}">← ${esc(ctxSet.s.nombre)}</a><span>${ctxSet.i + 1} de ${n}${it.momento ? " · " + esc(nombreMomento(it.momento)) : ""}${it.persona_id ? " · voz principal: " + esc(nombreDe(it.persona_id)) : ""}</span><span class="sp"></span>
      ${D.modo !== "local" ? `<button class="navbtn ${st.dirigir ? "on" : ""}" id="dirigir" title="Los demás ven la canción y sección que tú marques">📡 Dirigir</button><button class="navbtn ${st.seguir ? "on" : ""}" id="seguir" title="Abrir lo que marque quien dirige">${st.seguir ? '<span class="vivoind"><i></i>Siguiendo</span>' : "Seguir"}</button>` : ""}
      <button class="navbtn" id="prev" ${ctxSet.i <= 0 ? "disabled" : ""}>‹</button><button class="navbtn" id="next" ${ctxSet.i >= n - 1 ? "disabled" : ""}>›</button></div>`;
  }
  const sub = [c.autor && `<span class="subarts">${artistasHTML(c)}</span>`, `<span>Original <b>${esc(original)}</b></span>`, c.bpm && `<span><b>${c.bpm}</b> bpm</span>`, c.compas && `<span><b>${esc(c.compas)}</b></span>`, capo ? `<span>Capo <b>${capo}</b> · formas de <b>${esc(forma)}</b></span>` : "",
    esPrivada(c) && `<span>🔒 Solo <b>${esc(nombreMin(c.ministerio_id))}</b>${(c.compartida_con || []).length ? " · compartida con " + esc(c.compartida_con.map(nombreMin).join(", ")) : ""}</span>`].filter(Boolean).join("");
  const opTonos = C.TONOS.filter(t => t.endsWith("m") === original.endsWith("m")).map(t => `<option ${t === tono ? "selected" : ""}>${t}</option>`).join("");

  const main = `
  <div class="printhead"><h2>${esc(c.titulo)}</h2><div>${esc(c.autor || "")} · Tono ${esc(tono)}${capo ? " · Capo " + capo : ""}${c.bpm ? " · " + c.bpm + " bpm" : ""}</div></div>
  <div class="ctrls">
    <div class="tonobox" title="Tono"><button id="tmenos" aria-label="Bajar medio tono">−</button><select id="tsel" aria-label="Tono">${opTonos}</select><button id="tmas" aria-label="Subir medio tono">+</button></div>
    <label class="ctl" title="Capo">Capo <select id="capo">${[0, 1, 2, 3, 4, 5, 6, 7].map(n => `<option ${n === capo ? "selected" : ""}>${n}</option>`).join("")}</select></label>
    <div class="seg" role="radiogroup" aria-label="Notación">${NOTACIONES.map(([k, l]) => `<button role="radio" aria-checked="${e.notacion === k}" class="${e.notacion === k && !e.sinAcordes ? "on" : ""}" data-not="${k}">${l}</button>`).join("")}<button role="radio" aria-checked="${!!e.sinAcordes}" class="${e.sinAcordes ? "on" : ""}" data-not="letra" title="Solo letra (para voces)">Letra</button></div>
    <div class="ctl autobox" title="Desplazamiento automático (barra espaciadora; + y − cambian la velocidad)"><button id="tauto" class="${autoscroll.on ? "on" : ""}">${autoscroll.on ? "❚❚" : "▼"} Auto</button><button id="vmenos" aria-label="Más lento">−</button><output id="vval">${nivelVel()}</output><button id="vmas" aria-label="Más rápido">+</button></div>
    <button class="ctl" id="amenos" title="Letra más chica">A−</button><button class="ctl" id="amas" title="Letra más grande">A+</button>
    <button class="ctl ${e.cols === 2 ? "on" : ""}" id="tcols" title="Dos columnas">▥</button>
    <button class="ctl" id="tesc" title="Modo escenario">⤢</button>
    <button class="ctl escx" id="tescx">Salir</button>
    <span class="sp" style="flex:1"></span>
    ${D.nube && comparteCancion(c) ? `<button class="ctl noesc" id="tcomp" title="Elegir qué ministerios ven esta canción">↔ Compartir</button>` : ""}
    ${esMusico() && puedeEditarCancion(c) ? `<a class="ctl noesc" href="#editar/${c.id}">✎ Editar</a>` : ""}
    <button class="ctl noesc" id="tprint" title="Exportar PDF (1 o 2 columnas)">⎙ PDF</button>
  </div>
  <div class="tonosbar noesc">
    <span class="tbl">Tonos</span>
    <button class="tchip ${tono === original && !capo ? "on" : ""}" data-tono="${esc(original)}" data-capo="0">Original <small>${esc(original)}</small></button>
    ${tonosCerca.map(chipTono).join("")}
    ${tonosLejos.length ? (st.verOtros ? tonosLejos.map(chipTono).join("") : `<button class="tchip" id="votros" style="--c:var(--muted)">Otros ${tonosLejos.length}</button>`) : ""}
    <span class="sp"></span>
    ${esMio ? `<span class="tchip on fijo">★ Es tu tono</span><button class="btn xs ghost" id="qmio" title="Quitar mi tono">Quitar</button>`
      : `<button class="btn sm" id="gmio">★ Este es mi tono · ${esc(tono)}${capo ? " c" + capo : ""}</button>`}
    ${puedeOtros ? `<select class="fsel" id="gpara" aria-label="Guardar tono para otra persona"><option value="">Guardar este tono para…</option>${genteAsignable().filter(a => a.id !== yo().id).map(a => `<option value="${a.id}">${esc(a.nombre)}${D.uno("cif_tonos", c.id + "|" + a.id) ? " · ★ " + esc(D.uno("cif_tonos", c.id + "|" + a.id).tono) : ""}</option>`).join("")}</select>` : ""}
    ${ctxSet && editaSet(ctxSet.s) && ctxSet.item && ctxSet.item.tono !== tono ? `<button class="btn xs ghost" id="gset">Usar ${esc(tono)} en este set</button>` : ""}
  </div>
  ${secs.length > 1 ? `<div class="secchips noesc">${secs.map(s => `<button data-ir="${esc(s)}" style="--sc:var(${C.colorSeccion(s)})">${esc(s)}</button>`).join("")}</div>` : ""}
  <article class="cuerpo ${e.cols === 2 ? "dos" : ""} ${e.sinAcordes ? "sinacordes" : ""}" id="cuerpo">${html}</article>
  <div class="panelx">
    <section class="caja"><h3>Pistas</h3>
      ${tracks.length ? `<ul class="tracks">${tracks.map(t => `<li class="${rep.track && rep.track.id === t.id ? "on" : ""}"><button class="btn xs" data-pista="${t.id}">${rep.track && rep.track.id === t.id && rep.sonando ? "❚❚" : "▶"}</button><span><b>${esc(t.nombre)}</b><br><small>${esc(t.tipo)}${t.tono ? " · grabada en " + esc(t.tono) : ""}${t.subido_por ? " · subió " + esc(nombreDe(t.subido_por)) : ""}</small></span>${esMusico() ? `<button class="btn xs ghost" data-bpista="${t.id}" title="Quitar">✕</button>` : ""}</li>`).join("")}</ul>` : `<p>Sin pistas. Las pistas que suba cualquier músico le aparecen a todos y siguen el tono que estás viendo.</p>`}
      <div id="playerbox"></div>
      ${esMusico() ? `<label class="btn sm ghost" style="margin-top:10px;cursor:pointer">＋ Subir pista<input type="file" id="subpista" accept="audio/*" hidden></label>` : ""}
    </section>
    ${c.notas || c.liga ? `<section class="caja"><h3>Notas</h3>${c.notas ? `<p class="notas">${esc(c.notas)}</p>` : ""}${c.liga ? `<p style="margin-top:8px"><a href="${esc(c.liga)}" target="_blank" rel="noopener">Escuchar referencia ↗</a></p>` : ""}</section>` : ""}
  </div>`;
  return {
    band: bandHTML({ tag: ctxSet ? "En vivo" : "Canción", titulo: esc(c.titulo), sub, extra: setbar }),
    main,
    after() {
      const ponTono = t => { st.tonoVista[c.id] = t; render(); if (rep.track && rep.auto) ajustarPitch(); };
      $("#tsel").onchange = ev => { ev.target.blur(); ponTono(ev.target.value); };
      $("#tmenos").onclick = () => ponTono(C.transportaTono(tono, -1));
      $("#tmas").onclick = () => ponTono(C.transportaTono(tono, 1));
      $("#capo").onchange = ev => { ev.target.blur(); st.capo[c.id] = +ev.target.value; render(); };
      $$("[data-not]").forEach(b => b.onclick = () => {
        const k = b.dataset.not;
        if (k === "letra") st.estilo.sinAcordes = !st.estilo.sinAcordes; else { st.estilo.notacion = k; st.estilo.sinAcordes = false; }
        guardarEstilo(); render();
      });
      $("#tcols").onclick = () => { st.estilo.cols = st.estilo.cols === 2 ? 1 : 2; guardarEstilo(); render(); };
      $("#amenos").onclick = () => { st.estilo.tam = Math.max(12, st.estilo.tam - 2); guardarEstilo(); };
      $("#amas").onclick = () => { st.estilo.tam = Math.min(44, st.estilo.tam + 2); guardarEstilo(); };
      $("#tauto").onclick = alternarAutoscroll;
      $("#vmenos").onclick = () => cambiarVel(-1);
      $("#vmas").onclick = () => cambiarVel(1);
      $("#tesc").onclick = () => { document.body.classList.add("escenario"); document.documentElement.requestFullscreen?.().catch(() => {}); };
      $("#tescx").onclick = () => { document.body.classList.remove("escenario"); if (document.fullscreenElement) document.exitFullscreen(); };
      $("#tprint").onclick = () => abrirExportar({ items: [{ c, tono, capo, orden }], titulo: c.titulo, minId: ctxSet ? ctxSet.s.ministerio_id : (minActual() || {}).id });
      const tc = $("#tcomp"); if (tc) tc.onclick = () => compartirCancion(c);
      $$("[data-ir]").forEach(b => b.onclick = () => { irSeccion(b.dataset.ir); if (st.dirigir && vivo) vivo.enviar({ i: ctxSet.i, sec: b.dataset.ir }); });
      $$("[data-tono]").forEach(b => b.onclick = () => { st.tonoVista[c.id] = b.dataset.tono; st.capo[c.id] = +b.dataset.capo; render(); if (rep.track && rep.auto) ajustarPitch(); });

// Desplazamiento automático
const autoscroll = { on: false, vel: ls.get("cifrados-vel", 28), raf: 0, t: 0, acc: 0 };
function alternarAutoscroll() {
  autoscroll.on = !autoscroll.on;
  const b = $("#tauto"); if (b) { b.innerHTML = (autoscroll.on ? "❚❚" : "▼") + " Auto"; b.classList.toggle("on", autoscroll.on); }
  if (autoscroll.on) { autoscroll.t = performance.now(); autoscroll.acc = 0; autoscroll.raf = requestAnimationFrame(pasoScroll); }
  else cancelAnimationFrame(autoscroll.raf);
}
// velocidad en niveles 1–20 (8 px por segundo cada nivel), se ajusta ahí mismo con − y +
const nivelVel = () => Math.max(1, Math.min(20, Math.round(autoscroll.vel / 8)));
function cambiarVel(d) {
  autoscroll.vel = (nivelVel() + d) * 8;
  autoscroll.vel = Math.max(8, Math.min(160, autoscroll.vel)); ls.set("cifrados-vel", autoscroll.vel);
  const o = $("#vval"); if (o) o.textContent = nivelVel();
}
function pasoScroll(t) {
  const dt = (t - autoscroll.t) / 1000; autoscroll.t = t;
  autoscroll.acc += autoscroll.vel * dt;
  if (autoscroll.acc >= 1) { const n = Math.floor(autoscroll.acc); window.scrollBy(0, n); autoscroll.acc -= n; }
  if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 2) { autoscroll.on = false; const b = $("#tauto"); if (b) { b.innerHTML = "▼ Auto"; b.classList.remove("on"); } return; }
  autoscroll.raf = requestAnimationFrame(pasoScroll);
}
function detenerAutoscroll() { if (autoscroll.on) { autoscroll.on = false; cancelAnimationFrame(autoscroll.raf); } }
document.addEventListener("keydown", e => {
  if (!autoscroll.on || /INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || "")) return;
  if (e.key === "+" || e.key === "=") cambiarVel(1);
  if (e.key === "-") cambiarVel(-1);
});

// ---------- Pistas: cambiar tono sin cambiar velocidad (Tone.js GrainPlayer) ----------
const rep = { player: null, track: null, sonando: false, inicio: 0, offset: 0, dur: 0, rate: 1, ajuste: 0, auto: true, vol: 0, raf: 0, url: "" };

}

async function abrirPista(t, c, tono) {
  try {
    toast("Cargando pista…");
    await cargarTone(); await Tone.start();
    const blob = await D.audio(t.ruta);
    if (!blob) return toast("La pista no está en este dispositivo y no hay nube.");
    cerrarPista();
    rep.url = URL.createObjectURL(blob);
    const buf = await Tone.ToneAudioBuffer.fromUrl(rep.url);
    rep.player = new Tone.GrainPlayer({ url: buf, grainSize: 0.12, overlap: 0.06 }).toDestination();
    rep.track = t; rep.dur = buf.duration; rep.offset = 0; rep.ajuste = 0; rep.rate = 1; rep.tonoVista = tono;

}

function alternarPlay() {

  pintarPlayer(); $$("[data-pista]").forEach(b => b.textContent = rep.track && b.dataset.pista === rep.track.id && rep.sonando ? "❚❚" : "▶");
}

const mmss = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function pintarPlayer() {
  const box = $("#playerbox"); if (!box || !rep.track) return;

  box.innerHTML = `<div class="player" style="margin-top:12px">
    <div class="pl-top"><button class="playbtn" id="plplay" aria-label="Reproducir">${rep.sonando ? IC.pausa : IC.play}</button><div><b>${esc(rep.track.nombre)}</b><small id="pltime">${mmss(posPista())} / ${mmss(rep.dur)}</small></div></div>
    <input type="range" id="plpos" min="0" max="${rep.dur}" step="0.1" value="${posPista()}" aria-label="Posición">
    <div class="pl-ctl">
      <span>Tono</span><input type="range" id="plaj" min="-6" max="6" step="1" value="${rep.ajuste}"><output id="plsemis">${sm > 0 ? "+" : ""}${sm} st${suena ? " · " + esc(suena) : ""}</output>
      <span>Velocidad</span><input type="range" id="plrate" min="0.7" max="1.3" step="0.01" value="${rep.rate}"><output>${Math.round(rep.rate * 100)}%</output>
      <span>Volumen</span><input type="range" id="plvol" min="-30" max="6" step="1" value="${rep.vol}"><output>${rep.vol} dB</output>
    </div>
    <label class="row" style="font-size:13px;font-weight:600"><input type="checkbox" id="plauto" ${rep.auto ? "checked" : ""}> Seguir el tono de la canción${rep.track.tono ? "" : " (indica en qué tono está grabada la pista)"}</label>
  </div>`;
  $("#plplay").onclick = alternarPlay;

  const puede = ["admin", "musico"].includes(rolEn(m.id));

    band: bandHTML({ tag: m.nombre, titulo: "Sets de <em>" + esc(m.nombre) + "</em>", sub: `<span>Se actualizan en tiempo real para todo el ministerio y los ministerios invitados</span>` }),

        items: s.items.map(it => ({ it, c: D.uno("cif_canciones", it.cancion_id) })).filter(x => x.c).map(({ it, c }) => ({ c, tono: it.tono, capo: it.capo || 0, orden: it.estructura && it.estructura.length ? it.estructura : c.orden, nota: it.nota, momento: it.momento ? nombreMomento(it.momento) : "", persona: it.persona_id ? "Voz principal: " + nombreDe(it.persona_id) : "" })) });

      });
      const nuevoItem = (c, momento) => ({ id: D.uuid(), cancion_id: c.id, tono: c.tono || C.adivinaTono(c.contenido), persona_id: null, nota: "", ...(momento ? { momento } : {}) });
      // misa: agregar a un momento (queda en el orden de la misa)
      $$("[data-addm]").forEach(b => b.onclick = async () => {
        const k = b.dataset.addm, c = await elegirCancion(k);

        it.splice(ins, 0, nuevoItem(c, k)); guarda({ items: it }); toast(`«${c.titulo}» en ${nombreMomento(k)}.`);

        const rs = $("[data-reset]", box); if (rs) rs.onclick = () => { const x = itemsAct(); delete x[i].estructura; guarda({ items: x }); };

        $$(".blq", box).forEach(el => {

/** Ventana para escoger una canción; en misa propone primero las del momento. */
function elegirCancion(momento) {
  return new Promise(res => {
    const dl = document.createElement("dialog");
    dl.innerHTML = `<div class="dlg"><h2>${momento ? "Canción para " + esc(nombreMomento(momento)) : "Agregar canción"}</h2><input class="field" id="ecq" placeholder="Buscar…" autocomplete="off"><ul class="resultados" id="ecr" style="max-height:50vh"></ul><div class="row"><span class="sp"></span><button class="btn ghost" id="ecx">Cancelar</button></div></div>`;
    document.body.appendChild(dl);
    const fin = v => { dl.close(); dl.remove(); res(v); };
    const pinta = () => {
      const q = norm($("#ecq", dl).value);
      const pts = c => (momento && momentoDe(c) === momento ? 0 : 2) + (esLiturgica(c) ? 0 : 1);
      const r = canciones().filter(c => !q || norm(c.titulo + " " + c.autor).includes(q)).sort((a, b) => pts(a) - pts(b) || a.titulo.localeCompare(b.titulo, "es")).slice(0, 40);
      $("#ecr", dl).innerHTML = r.map(c => `<li><button data-c="${c.id}"><span><b>${esc(c.titulo)}</b> <small class="status">${esc(c.autor || "")}</small></span>${momento && momentoDe(c) === momento ? '<span class="chip mio">sugerida</span>' : ""}<span class="chip tono">${esc(c.tono || "")}</span></button></li>`).join("") || `<li class="status" style="padding:10px 12px">Sin resultados</li>`;
      $$("[data-c]", dl).forEach(b => b.onclick = () => fin(D.uno("cif_canciones", b.dataset.c)));
    };
    $("#ecq", dl).oninput = pinta; $("#ecx", dl).onclick = () => fin(null); dl.addEventListener("cancel", () => fin(null));
    pinta(); dl.showModal(); $("#ecq", dl).focus();
  });
}

      const vacia = k >= lineas.length || /^\s*\{/.test(lineas[k]);
      return `<div class="edsec" style="--sc:var(${C.colorSeccion(dir[2])})">${esc(dir[2])}</div>${vacia ? `<div class="edlin"><button class="addend vacia" data-l="${li}" data-nueva="1" title="Elige un acorde arriba y toca aquí">＋ Poner acordes</button></div>` : ""}`;
    }

        }

/** Pone o quita un acorde en la posición p (en la letra sin acordes) de la línea li. */
function ponerAcorde(li, p, ac, alFinal) {
  const lineas = ed.c.contenido.split("\n"), lin = lineas[li];
  let letra = "", marcas = []; const re = /\[([^\]]*)\]/g; let m, ult = 0;
  while ((m = re.exec(lin))) { letra += lin.slice(ult, m.index); marcas.push({ pos: letra.length, s: m[1] }); ult = re.lastIndex; }
  letra += lin.slice(ult);
  // al final: siempre dos espacios antes del acorde nuevo si ya hay un acorde ahí (líneas de solo acordes) o si la letra no termina en espacio
  if (alFinal) { if (ac) { if (marcas.some(x => x.pos === letra.length) || (letra.length && !/\s$/.test(letra))) letra += "  "; marcas.push({ pos: letra.length, s: ac }); } }

    const hay = marcas.filter(x => x.pos === p);
    marcas = marcas.filter(x => x.pos !== p);
    if (ac && !(hay.length === 1 && hay[0].s === ac)) marcas.push({ pos: p, s: ac });
  }
  marcas.sort((a, b) => a.pos - b.pos);
  let out = "", q = 0; marcas.forEach(x => { out += letra.slice(q, x.pos) + "[" + x.s + "]"; q = x.pos; });

  if (!letra.trim() && marcas.length) out = marcas.map(x => "[" + x.s + "]").join("  "), q = letra.length;
  lineas[li] = (out + letra.slice(q)).replace(/\s+$/, "");

// El logo se guarda ya recortado en círculo (PNG 320×320, transparente fuera del círculo).
// El tamaño con que sale en la banda y la portada va en la misma cadena como «#t=60…150» (por ciento; sin él, 100).
const logoSrc = l => (l ? String(l).split("#")[0] : null);
const logoTam = l => { const x = /#t=(\d+)/.exec(l || ""); return x ? Math.min(150, Math.max(60, +x[1])) : 100; };
/** Ventana para acomodar el logo dentro del círculo: arrastrar para mover y barra para acercar. Devuelve el PNG circular o null. */
function editarLogo(src) {
  return new Promise((ok, mal) => {
    const img = new Image();
    img.onerror = () => mal(new Error("No pude leer esa imagen."));
    img.onload = () => {
      const V = 240, base = V / Math.max(img.width, img.height); // de inicio cabe completo
      let z = 1, ox = 0, oy = 0;
      const dl = document.createElement("dialog");
      dl.innerHTML = `<form class="dlg" method="dialog"><h2>Ajustar logo</h2><p>Arrastra la imagen para acomodarla dentro del círculo.</p>
        <div class="recorte"><canvas width="${V * 2}" height="${V * 2}"></canvas></div>
        <label class="mcampo"><b>Acercar</b><span class="mctl"><input type="range" name="z" min="50" max="400" step="1" value="100"><code>100 %</code></span></label>
        <div class="row"><button type="button" class="btn ghost" data-centrar>Centrar</button><span class="sp"></span><button type="button" class="btn ghost" data-no>Cancelar</button><button class="btn">Listo</button></div></form>`;
      document.body.appendChild(dl);
      const cv = dl.querySelector("canvas"), cx = cv.getContext("2d"), rz = dl.querySelector("[name=z]");
      const medidas = () => ({ w: img.width * base * z, h: img.height * base * z });
      const limitar = () => { const { w, h } = medidas(), mx = Math.abs(w - V) / 2, my = Math.abs(h - V) / 2; ox = Math.max(-mx, Math.min(mx, ox)); oy = Math.max(-my, Math.min(my, oy)); };
      const dibujar = (ctx, k, recortar) => {
        const { w, h } = medidas();
        ctx.clearRect(0, 0, V * k, V * k); ctx.save();
        if (recortar) { ctx.beginPath(); ctx.arc(V * k / 2, V * k / 2, V * k / 2, 0, Math.PI * 2); ctx.clip(); }
        ctx.drawImage(img, (V / 2 + ox - w / 2) * k, (V / 2 + oy - h / 2) * k, w * k, h * k); ctx.restore();
        if (!recortar) { // sombra fuera del círculo y su orilla
          ctx.save(); ctx.fillStyle = "rgba(27,28,26,.6)"; ctx.beginPath(); ctx.rect(0, 0, V * k, V * k); ctx.arc(V * k / 2, V * k / 2, V * k / 2 - 1, 0, Math.PI * 2, true); ctx.fill("evenodd");
          ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(V * k / 2, V * k / 2, V * k / 2 - 2, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
        }
      };
      const pinta = () => { limitar(); dibujar(cx, 2, false); rz.nextElementSibling.textContent = Math.round(z * 100) + " %"; };
      rz.oninput = () => { z = rz.value / 100; pinta(); };
      cv.addEventListener("wheel", e => { e.preventDefault(); z = Math.max(0.5, Math.min(4, z * (e.deltaY < 0 ? 1.06 : 1 / 1.06))); rz.value = Math.round(z * 100); pinta(); }, { passive: false });
      let arr = null;
      cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); arr = { x: e.clientX, y: e.clientY }; cv.classList.add("mov"); };
      cv.onpointermove = e => { if (!arr) return; ox += e.clientX - arr.x; oy += e.clientY - arr.y; arr = { x: e.clientX, y: e.clientY }; pinta(); };
      cv.onpointerup = cv.onpointercancel = () => { arr = null; cv.classList.remove("mov"); };
      dl.querySelector("[data-centrar]").onclick = () => { ox = oy = 0; pinta(); };
      const fin = v => { dl.close(); dl.remove(); ok(v); };
      dl.querySelector("[data-no]").onclick = () => fin(null);
      dl.addEventListener("cancel", () => fin(null));
      dl.querySelector("form").onsubmit = e => {
        e.preventDefault();
        const out = document.createElement("canvas"); out.width = out.height = 320;
        dibujar(out.getContext("2d"), 320 / V, true); fin(out.toDataURL("image/png"));
      };
      pinta(); dl.showModal();
    };
    img.src = src;
  });
}

  const yo_ = ++banco.pide;

    const q = norm(banco.q), vistos = new Set();
    banco.res = D.lista("cif_canciones").filter(c => !c.borrada && (c.visibilidad || "todos") === "todos" && (!q || norm(c.titulo + " " + c.autor).includes(q)))

// ================= ENVÍOS E INTERCAMBIOS DE CANCIONES =================
// Un ministerio le «envía» a otro las canciones que el otro no tiene, o «intercambian» en los dos sentidos.
// El admin del que recibe acepta; en la nube copia cif_transferir() (migración 009); sin nube se copia aquí mismo.
const tituloN = t => norm(t).replace(/\s+/g, " ").trim();
/** Canciones que «origen» ve y «destino» no tiene (por título). Con lo que este dispositivo alcanza a ver. */
function faltanEn(origen, destino) {
  const todas = D.lista("cif_canciones").filter(c => !c.borrada);
  const ya = new Set(todas.filter(c => minVe(destino, c)).map(c => tituloN(c.titulo)));
  const vistos = new Set();
  return todas.filter(c => minVe(origen, c)).filter(c => { const k = tituloN(c.titulo); if (ya.has(k) || vistos.has(k)) return false; vistos.add(k); return true; });
}
async function copiarLocal(origen, destino) {
  const lista = faltanEn(origen, destino);
  for (const c of lista) {
    await D.guardar("cif_canciones", { ...c, compartida_con: [...new Set((c.compartida_con || []).concat(destino))] });
  }
  return lista.length;
}
function intercambiosHTML(min) {
  if (!hayColectivo() && D.nube) return "";
  const admin = rolEn(min.id) === "admin";
  const xs = D.lista("cif_intercambios").filter(x => x.de === min.id || x.para === min.id).sort((a, b) => String(b.creado || b.actualizado).localeCompare(String(a.creado || a.actualizado)));
  const entran = xs.filter(x => x.estado === "pendiente" && x.para === min.id), salen = xs.filter(x => x.estado === "pendiente" && x.de === min.id);
  const hechos = xs.filter(x => x.estado !== "pendiente").slice(0, 6);
  if (!admin && !xs.length) return "";
  const otros = D.lista("cif_ministerios").filter(m => m.id !== min.id).sort((a, b) => a.nombre.localeCompare(b.nombre));
  const tipoTxt = x => x.tipo === "intercambio" ? "intercambio" : "envío";
  const n = (o, d) => faltanEn(o, d).length;
  return `<section class="caja" id="inter"><h3>Pasar canciones</h3>
    <p>Puedes <b>enviarle</b> a otro ministerio tus canciones que no tenga, o hacer un <b>intercambio</b>: cada quien recibe las que le faltan. No se copian: se enlazan, así todos ven siempre la versión más nueva y solo la cambia quien la subió o su artista. El admin del otro ministerio acepta. Las de Tiempo de Dios ya las tienen todos.</p>
    ${entran.map(x => `<div class="interrow entra"><span><b>${esc(nombreMin(x.de))}</b> ${x.tipo === "intercambio" ? "propone un <b>intercambio</b>" : "te quiere <b>enviar</b> sus canciones"}${x.tipo === "intercambio" ? "" : ` (≈ ${n(x.de, min.id)} que no tienes)`}${x.mensaje ? ` · «${esc(x.mensaje)}»` : ""}</span>
      ${admin ? `<button class="btn xs" data-xacepta="${x.id}">Aceptar</button><button class="btn xs ghost" data-xrechaza="${x.id}">Rechazar</button>` : `<span class="status">Esperando a un admin</span>`}</div>`).join("")}
    ${salen.map(x => `<div class="interrow"><span>Propusiste un ${tipoTxt(x)} a <b>${esc(nombreMin(x.para))}</b> · esperando que acepte</span>${admin ? `<button class="btn xs ghost" data-xcancela="${x.id}">Cancelar</button>` : ""}</div>`).join("")}
    ${admin ? `<form class="interform" id="xform">
      <select class="field" name="para" required><option value="">¿Con qué ministerio?</option>${otros.map(m => `<option value="${m.id}">${esc(m.nombre)}${m.colectivo ? " · colectivo" : ""}</option>`).join("")}</select>
      <div class="segradio" role="radiogroup" aria-label="Tipo"><label><input type="radio" name="tipo" value="envio" checked><span>Enviar las mías</span></label><label><input type="radio" name="tipo" value="intercambio"><span>Intercambiar</span></label></div>
      <input class="field" name="mensaje" placeholder="Mensaje (opcional)" autocomplete="off" data-1p-ignore data-lpignore="true">
      <button class="btn">Proponer</button><span class="status" id="xcuenta"></span></form>` : ""}
    ${hechos.length ? `<ul class="interhist">${hechos.map(x => `<li><span>${x.estado === "aceptado" ? "✓" : "✕"} ${tipoTxt(x)} ${esc(nombreMin(x.de))} → ${esc(nombreMin(x.para))}</span><small class="status">${x.estado === "aceptado" && x.resultado ? `${x.resultado.a_para || 0} a ${esc(nombreMin(x.para))}${x.tipo === "intercambio" ? ` · ${x.resultado.a_de || 0} a ${esc(nombreMin(x.de))}` : ""}` : x.estado}</small></li>`).join("")}</ul>` : ""}
  </section>`;
}
function enlazarIntercambios() {
  const f = $("#xform");
  if (f) {
    const de = f.closest("[data-min]") ? f.closest("[data-min]").dataset.min : (ruta().p[0]);
    const cuenta = () => {
      const para = f.para.value, el = $("#xcuenta"); if (!para) return (el.textContent = "");
      const a = faltanEn(de, para).length, b = faltanEn(para, de).length;
      el.textContent = f.tipo.value === "intercambio" ? `≈ ${a} pasarían a ${nombreMin(para)} y ≈ ${b} a ${nombreMin(de)}` : `≈ ${a} canciones que ${nombreMin(para)} no tiene`;
    };
    f.para.onchange = cuenta; $$("[name=tipo]", f).forEach(r => (r.onchange = cuenta));
    f.onsubmit = async e => {
      e.preventDefault(); const para = f.para.value; if (!para) return;
      await D.guardar("cif_intercambios", { de, para, tipo: f.tipo.value, mensaje: f.mensaje.value.trim() || null, estado: "pendiente", creado_por: yo() ? yo().id : null, creado: new Date().toISOString() });
      toast(`Listo: le llegó a ${nombreMin(para)} para que un admin lo acepte.`); render();
    };
  }
  $$("[data-xacepta]").forEach(b => b.onclick = async () => {
    const x = D.uno("cif_intercambios", b.dataset.xacepta); b.disabled = true;
    try {
      let r;
      if (D.nube) r = await D.rpc("cif_transferir", { i: x.id });
      else { r = { a_para: await copiarLocal(x.de, x.para), a_de: x.tipo === "intercambio" ? await copiarLocal(x.para, x.de) : 0 }; await D.guardar("cif_intercambios", { ...x, estado: "aceptado", resultado: r }); }
      toast(`Listo: ${r.a_para || 0} canciones pasaron a ${nombreMin(x.para)}${x.tipo === "intercambio" ? ` y ${r.a_de || 0} a ${nombreMin(x.de)}` : ""}.`);
      render();
    } catch (er) { b.disabled = false; toast(er.message || String(er)); }
  });
  $$("[data-xrechaza]").forEach(b => b.onclick = async () => { const x = D.uno("cif_intercambios", b.dataset.xrechaza); await D.guardar("cif_intercambios", { ...x, estado: "rechazado" }); toast("Rechazado."); });
  $$("[data-xcancela]").forEach(b => b.onclick = async () => { const x = D.uno("cif_intercambios", b.dataset.xcancela); await D.guardar("cif_intercambios", { ...x, estado: "cancelado" }); toast("Cancelado."); });
}

  $$("[data-colect]").forEach(x => x.onchange = async () => {

    e.preventDefault();
    const n = fm.nombre.value.trim(), tipo = fm.tipo.value, adminId = fm.admin.value; if (!n) return;

    if (adminId) await D.guardar("cif_miembros", { ministerio_id: m.id, persona_id: adminId, rol: "admin" });

  };
  $$("[data-mtipo]").forEach(x => x.onchange = () => { const m = D.uno("cif_ministerios", x.dataset.mtipo); x.blur(); D.guardar("cif_ministerios", { ...m, tipo: x.value }); });
  $$("[data-mnom]").forEach(x => x.onchange = () => { const m = D.uno("cif_ministerios", x.dataset.mnom), v = x.value.trim(); x.blur(); if (!v) { x.value = m.nombre; return; } D.guardar("cif_ministerios", { ...m, nombre: v }); toast("Nombre actualizado."); });
  $$("[data-susc]").forEach(x => x.onchange = () => { const m = D.uno("cif_ministerios", x.dataset.susc); x.blur(); D.guardar("cif_ministerios", { ...m, suscripcion_hasta: x.value || null }); });
  $$("[data-nombra]").forEach(x => x.onchange = async () => {
    const m = x.dataset.nombra, p = x.value; x.blur(); if (!p) return;
    await D.guardar("cif_miembros", { ...(D.uno("cif_miembros", m + "|" + p) || {}), ministerio_id: m, persona_id: p, rol: "admin" });
    toast(`${nombreDe(p)} ahora es admin de ${(D.uno("cif_ministerios", m) || {}).nombre}.`);
  });
  $$("[data-mborrar]").forEach(b => b.onclick = async () => {
    const m = D.uno("cif_ministerios", b.dataset.mborrar);
    const d = await dialogo(`<h2>¿Borrar ${esc(m.nombre)}?</h2><p>Se borran sus sets, integrantes y solicitudes. La librería y los tonos no se tocan. No se puede deshacer.</p><label class="lb">Escribe el nombre para confirmar<input class="field" name="conf" autocomplete="off"></label>`, "Borrar");
    if (!d) return;
    if (norm(d.conf) !== norm(m.nombre)) return toast("El nombre no coincide; no se borró.");
    await D.borrar("cif_ministerios", m);
    // lo dependiente se borra en cascada en la nube; aquí se limpia la copia local
    D.lista("cif_miembros").filter(x => x.ministerio_id === m.id).forEach(x => D.aplicarLocal("cif_miembros", [x], true));
    D.lista("cif_sets").filter(x => x.ministerio_id === m.id).forEach(x => D.aplicarLocal("cif_sets", [x], true));
    D.lista("cif_solicitudes").filter(x => x.ministerio_id === m.id).forEach(x => D.aplicarLocal("cif_solicitudes", [x], true));
    toast(`«${m.nombre}» se borró.`);
  });
  $$("[data-pide]").forEach(b => b.onclick = async () => {
    const m = D.uno("cif_ministerios", b.dataset.pide);
    const d = await dialogo(`<h2>Unirme a ${esc(m.nombre)}</h2><p>Un admin del ministerio o el desarrollador revisará tu solicitud.</p><label class="lb">Mensaje (opcional)<input class="field" name="mensaje" placeholder="Canto en el coro de los domingos…"></label>`, "Enviar solicitud");
    if (!d) return;
    const s = await D.guardar("cif_solicitudes", { ministerio_id: m.id, persona_id: yo().id, mensaje: d.mensaje || null, estado: "pendiente" });
    toast("Solicitud enviada. Te avisamos por correo cuando te acepten.");
    avisarCorreo("aviso_solicitud", s.id);
  });
  $$("[data-cancela]").forEach(b => b.onclick = () => { D.lista("cif_solicitudes").filter(s => s.ministerio_id === b.dataset.cancela && s.persona_id === yo().id && s.estado === "pendiente").forEach(s => D.borrar("cif_solicitudes", s)); });
  $$("[data-acepta]").forEach(b => b.onclick = async () => {
    const s = D.uno("cif_solicitudes", b.dataset.acepta), sel = $(`[data-solrol="${s.id}"]`), rol = sel ? sel.value : "musico";

    toast(`${nombreDe(s.persona_id)} ya es parte del ministerio (${ROL_TXT[rol].toLowerCase()}).`);
    avisarCorreo("aviso_respuesta", s.id);
  });
  $$("[data-rechaza]").forEach(b => b.onclick = async () => { const s = D.uno("cif_solicitudes", b.dataset.rechaza); await D.guardar("cif_solicitudes", { ...s, estado: "rechazada" }); toast("Solicitud rechazada."); avisarCorreo("aviso_respuesta", s.id); });
  $$("[data-invita]").forEach(f => f.onsubmit = async e => {
    e.preventDefault();
    const m = f.dataset.invita, email = f.email.value.trim(), nombre = f.nombre.value.trim();
    try {
      const r = await D.fn("usuarios", { accion: "invitar", email, nombre, ministerio_id: m, rol: "musico", redirectTo: location.origin + location.pathname });
      toast(r.existia ? `${email} ya tenía cuenta: quedó agregado al ministerio.` : `Invitación enviada a ${email}.`);
      f.reset(); D.sincronizar();
    } catch (er) { toast(er.message); }
  });
  $$("[data-rol]").forEach(s => s.onchange = () => { const [m, p] = s.dataset.rol.split("|"); s.blur(); D.guardar("cif_miembros", { ...D.uno("cif_miembros", m + "|" + p), rol: s.value }); });
  $$("[data-saca]").forEach(b => b.onclick = async () => { const [m, p] = b.dataset.saca.split("|"); if (await confirmar(`¿Quitar a ${nombreDe(p)} del ministerio?`)) D.borrar("cif_miembros", { ministerio_id: m, persona_id: p }); });
  $$("[data-agrega]").forEach(b => b.onclick = async () => {
    const inp = $(`[data-nuevo="${b.dataset.agrega}"]`), n = inp.value.trim(); if (!n) return;
    const p = await D.guardar("cif_perfiles", { id: D.uuid(), nombre: n, usuario: norm(n).replace(/[^a-z0-9]+/g, "."), artista: true, estilo: {} });
    await D.guardar("cif_miembros", { ministerio_id: b.dataset.agrega, persona_id: p.id, rol: "musico" });
  });
}

/** Manda un aviso por correo cuando el cambio ya subió a la nube (si falla, no estorba). */
async function avisarCorreo(accion, solicitud_id) {
  if (!D.nube) return;
  for (let i = 0; i < 40 && D.estado.pendientes > 0; i++) await new Promise(r => setTimeout(r, 250));
  try { await D.fn("usuarios", { accion, solicitud_id }); } catch (e) { console.warn("aviso por correo:", e.message); }
}

// ================= USUARIOS (desarrollador) =================
// Todas las cuentas: invitar, crear con contraseña, reenviar, quitar, nombrar desarrollador y asignar ministerios.
const cuentas = { lista: null, cargando: false, error: "", q: "" };
async function cargarCuentas() {
  if (!D.nube || cuentas.cargando) return;
